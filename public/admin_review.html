<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Review Queue — Sangha (prototype)</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Lato:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#FFFFFF; --card:#FFFDF8; --forest:#000; --rust:#F2A94E; --sage:#FBE3B8; --ink:#0D0D0D; --line:#E4E4E4; }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Lato',sans-serif;-webkit-font-smoothing:antialiased;}
  button,select,input{font-family:inherit;}
  button{cursor:pointer;}
  .wrap{max-width:780px;margin:0 auto;padding:20px 20px 80px;}
  .userbar{display:flex;justify-content:flex-end;align-items:center;gap:12px;margin-bottom:18px;}
  .userbar .who{text-align:right;line-height:1.25;}
  .userbar .who-name{font-weight:700;font-size:13.5px;}
  .userbar .who-role{font-size:11.5px;opacity:.6;}
  .dp{width:42px;height:42px;border-radius:50%;background:var(--forest);color:var(--rust);display:flex;align-items:center;justify-content:center;font-family:'Poppins',sans-serif;font-weight:700;font-size:14px;overflow:hidden;flex-shrink:0;border:2px solid var(--sage);}
  .dp img{width:100%;height:100%;object-fit:cover;display:block;}
  .title{font-family:'Poppins',sans-serif;font-size:26px;font-weight:700;margin-bottom:16px;}
  .scope{background:var(--forest);color:#fff;border-radius:12px;padding:13px 16px;font-size:12.5px;line-height:1.6;margin-bottom:16px;}
  .scope b{color:var(--rust);}
  .filters{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:16px;}
  .filters-title{font-size:11px;text-transform:uppercase;letter-spacing:.06em;opacity:.55;font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}
  .filters-title button{background:none;border:none;font-size:12px;font-weight:700;text-decoration:underline;text-transform:none;letter-spacing:0;opacity:.8;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;}
  .grid label{display:block;font-size:11px;font-weight:700;opacity:.6;margin-bottom:4px;}
  .grid select,.grid input{width:100%;padding:9px 10px;border-radius:9px;border:1px solid var(--line);font-size:13px;background:#fff;outline:none;}
  .grid select:focus,.grid input:focus{border-color:var(--rust);}
  .tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
  .tab{padding:8px 15px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:700;}
  .tab.on{background:var(--ink);color:#fff;border-color:var(--ink);}
  .ev{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;cursor:pointer;transition:border-color .15s,box-shadow .15s;}
  .ev:hover{border-color:var(--rust);box-shadow:0 4px 16px rgba(0,0,0,.06);}
  .ev-title a{color:inherit;text-decoration:none;}
  .ev-title a:hover{text-decoration:underline;}
  .view-link{display:inline-block;font-size:12px;font-weight:700;color:#8a5b12;text-decoration:none;margin:0 0 12px;}
  .view-link:hover{text-decoration:underline;}
  .ev-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
  .ev-title{font-family:'Poppins',sans-serif;font-size:16px;font-weight:700;}
  .ev-meta{font-size:12px;opacity:.6;margin-top:3px;line-height:1.55;}
  .pill{flex-shrink:0;font-size:10.5px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--sage);border:1px solid var(--rust);white-space:nowrap;}
  .pill.ok{background:#eef7ee;border-color:#bfe3bf;color:#2e7d32;}
  .pill.no{background:#fdecea;border-color:#e5b4ac;color:#c0392b;}
  .desc{font-size:13px;line-height:1.6;opacity:.85;margin:12px 0;}
  .acts{display:flex;gap:10px;}
  .approve{flex:1;padding:11px;border-radius:10px;background:#2e7d32;color:#fff;font-weight:700;font-size:13px;border:none;}
  .approve:hover{opacity:.9;}
  .reject{flex:1;padding:11px;border-radius:10px;background:transparent;border:1.5px solid #c0392b;color:#c0392b;font-weight:700;font-size:13px;}
  .reject:hover{background:#fdecea;}
  .reason{display:none;gap:8px;margin-top:10px;}
  .reason.show{display:flex;}
  .reason input{flex:1;padding:9px 11px;border-radius:8px;border:1px solid var(--line);font-size:12.5px;outline:none;}
  .confirm{padding:9px 14px;border-radius:8px;background:#c0392b;color:#fff;font-weight:700;font-size:12px;border:none;flex-shrink:0;}
  .note{font-size:12px;opacity:.6;margin-top:8px;}
  .seen-tag{display:inline-block;font-size:11px;font-weight:700;color:#8a5b12;background:var(--sage);border-radius:999px;padding:2px 9px;margin-top:6px;}
  .undo{background:none;border:none;font-size:12px;text-decoration:underline;opacity:.65;margin-left:8px;}
  .empty{font-size:14px;opacity:.55;text-align:center;padding:40px 0;}
  .foot{text-align:center;margin-top:8px;}
  .foot button{font-size:12px;opacity:.6;text-decoration:underline;background:none;border:none;}
</style>
<style>html.sg-locked body{visibility:hidden}</style>
<script>document.documentElement.classList.add("sg-locked")</script>
</head>
<body>
<div class="wrap">
  <!-- Who is logged in. Filled in by renderUserChip() from getCurrentAdmin(). -->
  <div class="userbar">
    <div class="who"><div class="who-name" id="userName"></div><div class="who-role" id="userRole"></div></div>
    <div class="dp" id="userDp"></div>
  </div>

  <div class="title">Review Queue</div>

  <div class="scope" id="scopeBox"></div>

  <div class="filters">
    <div class="filters-title"><span>Filter</span><button id="clearBtn" type="button">Clear filters</button></div>
    <div class="grid">
      <div><label for="fCategory">Category</label><select id="fCategory"></select></div>
      <div><label for="fCountry">Country</label><select id="fCountry"></select></div>
      <div><label for="fState">State / region</label><select id="fState"></select></div>
      <div><label for="fCity">City</label><select id="fCity"></select></div>
      <div><label for="fZip">Zip / postal code</label><input id="fZip" type="text" placeholder="e.g. 787"></div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab on" data-tab="pending" type="button">Pending <span id="cntPending"></span></button>
    <button class="tab" data-tab="approved" type="button">Approved <span id="cntApproved"></span></button>
    <button class="tab" data-tab="rejected" type="button">Rejected <span id="cntRejected"></span></button>
    <button class="tab" data-tab="viewed" type="button" title="Opened, but not approved or rejected yet">Viewed <span id="cntViewed"></span></button>
  </div>

  <div id="list"></div>
  <div class="foot"><button id="resetBtn" type="button">Reset demo data</button></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-functions-compat.js"></script>
<script src="/js/firebase-config.js"></script>
<script src="/js/sanga-auth.js"></script>
<script src="/js/admin-session.js"></script>
<script>
const DEC_KEY      = 'sanga_admin_decisions_v1';
const VIEWED_KEY   = 'sanga_admin_viewed_v1';   // { [adminId]: { [eventId]: time first/last opened } }

// Names for the sample people (matches the Admin Settings page).
function jget(k, d){ try{ return JSON.parse(localStorage.getItem(k)) || d; }catch(e){ return d; } }
function jset(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const emptyScope = () => ({ countries:[], states:[], cities:[], zips:[], categories:[] });
const normScope = (s) => Object.assign(emptyScope(), s || {});

// Sample events. Location is split into country / state / city / zip so it can be filtered;
// the rest (date, price, includes…) is what the event details page displays.
const EVENTS = [
  { id:'e1',  title:'Sunrise Yoga by the Ganges',    country:'India',                state:'Uttarakhand', city:'Rishikesh',     zip:'249201',   category:'Junior Yoga',      audience:'Everyone', host:'Meera Iyer',      dateDisplay:'Sat, Nov 14, 2026', timeDisplay:'6:30 AM – 8:30 AM',  duration:'2 hours',   price:'25', groupSize:'Up to 15 guests',    includes:['Yoga mat','Herbal tea','Guided meditation'],          cancellation:'Full refund up to 48 hours before the event.', description:'A gentle two-hour morning practice on the riverbank, open to all levels. Mats provided, followed by herbal tea and a short guided meditation.' },
  { id:'e2',  title:'Plant-Based Brunch Circle',     country:'United States',        state:'Texas',       city:'Austin',        zip:'78701',    category:'Sattvic Cooking',  audience:'Group',    host:'Jordan Lee',      dateDisplay:'Sun, Nov 15, 2026', timeDisplay:'10:30 AM – 1:00 PM', duration:'2.5 hours', price:'35', groupSize:'Up to 12 guests',    includes:['All ingredients','Recipe cards','Brunch for everyone'],cancellation:'Full refund up to 72 hours before the event.', description:'Cook and share a full vegan brunch together. Small group, all ingredients included, recipes sent afterwards.' },
  { id:'e3',  title:'Forest Bathing Walk',           country:'United States',        state:'Colorado',    city:'Denver',        zip:'80202',    category:'Nature Explorers', audience:'Everyone', host:'Sam Ortiz',       dateDisplay:'Sat, Nov 21, 2026', timeDisplay:'9:00 AM – 11:00 AM', duration:'2 hours',   price:'20', groupSize:'Up to 10 guests',    includes:['Guided prompts','Trail map'],                         cancellation:'Full refund up to 24 hours before the event.', description:'A slow, silent two-hour walk with guided sensory prompts. Wear comfortable shoes; light rain is fine.' },
  { id:'e4',  title:'Storytelling for Little Ones',  country:'United Kingdom',       state:'England',     city:'London',        zip:'SW1A 1AA', category:'Storytelling',     audience:'Kids',     host:'Hannah Price',    dateDisplay:'Sat, Nov 21, 2026', timeDisplay:'10:00 AM – 11:00 AM',duration:'1 hour',    price:'12', groupSize:'Up to 8 children',   includes:['Craft kit','Storybook to keep'],                      cancellation:'Full refund up to 48 hours before the event.', description:'An interactive story hour for ages 4–8 with puppets, music and a small craft to take home.' },
  { id:'e5',  title:'Stargazing Night on the Dunes', country:'United Arab Emirates', state:'Dubai',       city:'Dubai',         zip:'',         category:'Sky Gazing',       audience:'Everyone', host:'Omar Khalid',     dateDisplay:'Fri, Nov 27, 2026', timeDisplay:'7:30 PM – 10:30 PM', duration:'3 hours',   price:'45', groupSize:'Up to 20 guests',    includes:['Telescopes','Warm drinks','Blankets'],                cancellation:'Full refund up to 48 hours before the event.', description:'Telescopes provided. Learn to spot constellations away from city light, with warm drinks around a fire.' },
  { id:'e6',  title:'Public Speaking Without Fear',  country:'India',                state:'Karnataka',   city:'Bengaluru',     zip:'560001',   category:'Public Speaking',  audience:'Group',    host:'Divya Rao',       dateDisplay:'Sun, Nov 22, 2026', timeDisplay:'2:00 PM – 5:00 PM',  duration:'3 hours',   price:'30', groupSize:'Up to 16 guests',    includes:['Workbook','Personal feedback'],                       cancellation:'Full refund up to 72 hours before the event.', description:'A practical workshop to build confidence, with short exercises and friendly feedback in small groups.' },
  { id:'e7',  title:'Mindful Sourdough Baking',      country:'United States',        state:'Texas',       city:'Austin',        zip:'78704',    category:'Mindful Baking',   audience:'Everyone', host:'Chris Doyle',     dateDisplay:'Sat, Dec 5, 2026',  timeDisplay:'9:00 AM – 12:30 PM', duration:'3.5 hours', price:'55', groupSize:'Up to 8 guests',     includes:['Sourdough starter to keep','Your own loaf','All ingredients'], cancellation:'Full refund up to 5 days before the event.', description:'Learn the rhythm of sourdough — mixing, folding and shaping — and leave with your own starter and loaf.' },
  { id:'e8',  title:'Zero-Waste Home Workshop',      country:'Mexico',               state:'Mexico City', city:'Mexico City',   zip:'06000',    category:'Sustainability',   audience:'Everyone', host:'Lucia Fernandez', dateDisplay:'Sun, Dec 6, 2026',  timeDisplay:'11:00 AM – 1:00 PM', duration:'2 hours',   price:'15', groupSize:'Up to 25 guests',    includes:['DIY recipes','Take-home kit'],                        cancellation:'Full refund up to 48 hours before the event.', description:'Simple swaps and DIY recipes to cut household waste. Bring a jar; we supply the rest.' },
  { id:'e9',  title:'Hill Sunrise Trek',             country:'India',                state:'Uttarakhand', city:'Dehradun',      zip:'248001',   category:'Hiking',           audience:'Everyone', host:'Rohit Negi',      dateDisplay:'Sat, Nov 28, 2026', timeDisplay:'5:30 AM – 9:00 AM',  duration:'3.5 hours', price:'18', groupSize:'Up to 14 guests',    includes:['Packed breakfast','Trail guide'],                     cancellation:'Full refund up to 48 hours before the event.', description:'A moderate 6 km climb to catch the sunrise, with a packed breakfast at the top. Good shoes required.' },
  { id:'e10', title:'Sourdough for Beginners',       country:'United States',        state:'Texas',       city:'Houston',       zip:'77002',    category:'Mindful Baking',   audience:'Everyone', host:'Alicia Brooks',   dateDisplay:'Sun, Dec 13, 2026', timeDisplay:'10:00 AM – 12:00 PM',duration:'2 hours',   price:'40', groupSize:'Up to 10 guests',    includes:['All ingredients','Bake in our studio ovens'],         cancellation:'Full refund up to 72 hours before the event.', description:'A relaxed first lesson in sourdough: starter care, mixing, and a first bake in our studio ovens.' },
  { id:'e11', title:'Bay Area Sustainability Meetup',country:'United States',        state:'California',  city:'San Francisco', zip:'94103',    category:'Sustainability',   audience:'Group',    host:'Noah Kim',        dateDisplay:'Thu, Dec 3, 2026',  timeDisplay:'6:30 PM – 8:30 PM',  duration:'2 hours',   price:'0',  groupSize:'Up to 40 guests',    includes:['Light snacks'],                                       cancellation:'Free event — no cancellation fee.',            description:'An evening of short talks and swaps on sustainable living, with light snacks and time to connect.' },
  { id:'e12', title:'Boulder Creek Hike',            country:'United States',        state:'Colorado',    city:'Boulder',       zip:'80302',    category:'Hiking',           audience:'Everyone', host:'Emily Ward',      dateDisplay:'Sat, Dec 12, 2026', timeDisplay:'9:00 AM – 11:00 AM', duration:'2 hours',   price:'10', groupSize:'Up to 15 guests',    includes:['Picnic by the creek','Trail guide'],                  cancellation:'Full refund up to 24 hours before the event.', description:'An easy two-hour creekside hike suitable for beginners, ending with a picnic by the water.' },
];

/* ---- link to the event details page ----
   Opens event_detail_view.html read-only (readonly=1 hides the message-host and share
   buttons, which a reviewer shouldn't use; review=1 hides the guest's "You're going —
   booking confirmed" banner, which doesn't apply to a reviewer).
   These are SAMPLE events, which Sangha's own data doesn't know about, so their details
   are passed in the link. Once this page is fed real Sangha events, set
   USE_SAMPLE_DETAILS = false: the link becomes just  ?id=<eventId>&readonly=1  and the
   details page loads the real event itself. (Leave it true with real events and the
   copied-in values would override the real ones.) */
const DETAIL_PAGE = 'event_detail_view.html';
// Where clicking the host (on the details page) goes. Real events: pass ?hostId=<id>.
const HOST_PROFILE_PAGE = 'host_profile_view.html';
function hostProfileUrl(e){
  const q = new URLSearchParams({ host: e.host });
  if(e.hostId) q.set('hostId', e.hostId);
  return HOST_PROFILE_PAGE + '?' + q.toString();
}
const USE_SAMPLE_DETAILS = true;
function eventDetailUrl(e){
  const q = new URLSearchParams({ id: e.id, readonly: '1', review: '1' });
  q.set('hostProfile', hostProfileUrl(e));
  if(USE_SAMPLE_DETAILS){
    q.set('status', 'upcoming');
    q.set('title', e.title);
    q.set('host', e.host);
    q.set('category', e.category);
    q.set('city', [e.city, e.country].filter(Boolean).join(', '));
    q.set('desc', e.description);
    q.set('dateDisplay', e.dateDisplay);
    q.set('timeDisplay', e.timeDisplay);
    q.set('duration', e.duration);
    q.set('price', e.price);
    q.set('groupSize', e.groupSize);
    q.set('includes', JSON.stringify(e.includes || []));
    q.set('cancellation', e.cancellation || '');
  }
  return DETAIL_PAGE + '?' + q.toString();
}

/* ========== IDENTITY — the signed-in admin ==========
   js/admin-session.js signs the person in (same phone + PIN login as the app), checks their
   record in the Firestore "admins" collection, and fills SanghaAdmin.admin:
       { role: 'main' | 'admin', userId, name, roleLabel, avatar, scope }
   Until that is ready this returns a harmless placeholder (the page is hidden meanwhile). */
function getCurrentAdmin(){
  return (window.SanghaAdmin && SanghaAdmin.admin) || { role:'admin', userId:'', name:'', roleLabel:'', avatar:'', scope:null };
}
/* ========================================================================== */
let roles = {};   // (kept so older code paths still find it; real limits come from SanghaAdmin.admin.scope)

let me, isMain, myScope;
function loadIdentity(){
  me = getCurrentAdmin();
  isMain = me.role === 'main';
  myScope = isMain ? null : normScope(me.scope);
}
loadIdentity();
let decisions = jget(DEC_KEY, {});
let tab = 'pending';
const f = { category:'', country:'', state:'', city:'', zip:'' };

function inScope(ev, s){
  if(!s) return true;
  const ci = (a, v) => a.some(x => x.toLowerCase() === String(v || '').toLowerCase());
  if(s.countries.length && !ci(s.countries, ev.country)) return false;
  if(s.states.length && !ci(s.states, ev.state)) return false;
  if(s.cities.length && !ci(s.cities, ev.city)) return false;
  if(s.zips.length && !s.zips.some(z => String(ev.zip || '').toLowerCase().startsWith(z.toLowerCase()))) return false;
  if(s.categories.length && !s.categories.includes(ev.category)) return false;
  return true;
}
const baseEvents = () => EVENTS.filter(e => inScope(e, myScope));
const uniq = (arr) => Array.from(new Set(arr.filter(Boolean))).sort((a, b) => a.localeCompare(b));

function fill(id, values, current, allLabel){
  const el = document.getElementById(id);
  el.innerHTML = `<option value="">${allLabel}</option>` + values.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join('');
  el.value = values.includes(current) ? current : '';
  return el.value;
}

function renderFilters(){
  const base = baseEvents();
  f.category = fill('fCategory', uniq(base.map(e => e.category)), f.category, 'All categories');
  f.country  = fill('fCountry',  uniq(base.map(e => e.country)),  f.country,  'All countries');
  const inCountry = base.filter(e => !f.country || e.country === f.country);
  f.state    = fill('fState',    uniq(inCountry.map(e => e.state)), f.state, 'All states');
  const inState = inCountry.filter(e => !f.state || e.state === f.state);
  f.city     = fill('fCity',     uniq(inState.map(e => e.city)),  f.city,     'All cities');
}

function passes(e){
  return (!f.category || e.category === f.category)
      && (!f.country  || e.country === f.country)
      && (!f.state    || e.state === f.state)
      && (!f.city     || e.city === f.city)
      && (!f.zip      || String(e.zip || '').toLowerCase().startsWith(f.zip.toLowerCase()));
}

function scopeText(){
  const parts = [];
  if(myScope.countries.length)  parts.push(`countries: <b>${esc(myScope.countries.join(', '))}</b>`);
  if(myScope.states.length)     parts.push(`states: <b>${esc(myScope.states.join(', '))}</b>`);
  if(myScope.cities.length)     parts.push(`cities: <b>${esc(myScope.cities.join(', '))}</b>`);
  if(myScope.zips.length)       parts.push(`zip codes: <b>${esc(myScope.zips.join(', '))}</b>`);
  if(myScope.categories.length) parts.push(`categories: <b>${esc(myScope.categories.join(', '))}</b>`);
  return parts.length ? 'You review ' + parts.join(' &nbsp;·&nbsp; ') : "You review <b>every</b> event — the main admin hasn't narrowed your scope yet.";
}

/* ---- "Viewed" = events this admin has opened to read the details ---- */
let viewedAll = jget(VIEWED_KEY, {});
const myViewed = () => viewedAll[me.userId] || {};
const seenTag = '<span class="seen-tag">✓ Viewed</span>';

// which events fall in each tab (after scope + filters)
function groups(){
  const visible = baseEvents().filter(passes);
  const seen = myViewed();
  return {
    pending:  visible.filter(e => !decisions[e.id]),
    approved: visible.filter(e => decisions[e.id] && decisions[e.id].status === 'approved'),
    rejected: visible.filter(e => decisions[e.id] && decisions[e.id].status === 'rejected'),
    // Viewed = opened, but not decided yet (opened − approved − rejected). Once you approve or
    // reject an event it moves to Approved/Rejected; Undo brings it back here if it was opened.
    viewed:   visible.filter(e => seen[e.id] && !decisions[e.id]).sort((a, b) => seen[b.id] - seen[a.id]),   // most recently opened first
  };
}
function refreshCounts(){
  const g = groups();
  ['Pending','Approved','Rejected','Viewed'].forEach(n => { document.getElementById('cnt' + n).textContent = `(${g[n.toLowerCase()].length})`; });
}
// Called when an event's details are opened. Updates in place (no re-draw), so the
// link/click that triggered it is never interrupted.
function markViewed(id){
  viewedAll = jget(VIEWED_KEY, {});
  (viewedAll[me.userId] = viewedAll[me.userId] || {})[id] = Date.now();
  jset(VIEWED_KEY, viewedAll);
  const slot = document.querySelector(`.ev[data-id="${id}"] .seen-slot`);
  if(slot) slot.innerHTML = seenTag;
  refreshCounts();
}

const EMPTY = {
  pending:  ['Nothing waiting for review right now. 🎉', 'No pending events match these filters.'],
  approved: ['No approved events yet.', 'No approved events match these filters.'],
  rejected: ['No rejected events yet.', 'No rejected events match these filters.'],
  viewed:   ["Nothing here. Events you open but haven't approved or rejected yet show up in this tab.", 'No viewed events match these filters.'],
};

function render(){
  renderFilters();
  refreshCounts();
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.tab === tab));

  const list = document.getElementById('list');
  const shown = groups()[tab];
  if(!shown.length){
    const filtering = f.category || f.country || f.state || f.city || f.zip;
    list.innerHTML = `<div class="empty">${EMPTY[tab][filtering ? 1 : 0]}</div>`;
    return;
  }
  const seen = myViewed();
  list.innerHTML = shown.map(e => {
    const d = decisions[e.id];
    const place = [e.city, e.state, e.country].filter(Boolean).join(', ') + (e.zip ? ' · ' + e.zip : '');
    return `
    <div class="ev" data-id="${e.id}">
      <div class="ev-head">
        <div>
          <div class="ev-title"><a href="${esc(eventDetailUrl(e))}" target="_blank" rel="noopener">${esc(e.title)}</a></div>
          <div class="ev-meta">${esc(place)}<br>${esc(e.category)} · hosted by ${esc(e.host)}</div>
          <div class="seen-slot">${seen[e.id] ? seenTag : ''}</div>
        </div>
        <span class="pill ${d ? (d.status === 'approved' ? 'ok' : 'no') : ''}">${d ? (d.status === 'approved' ? 'Approved' : 'Rejected') : esc(e.audience)}</span>
      </div>
      <div class="desc">${esc(e.description)}</div>
      <a class="view-link" href="${esc(eventDetailUrl(e))}" target="_blank" rel="noopener">View full details →</a>
      ${d ? `<div class="note">${d.status === 'rejected' && d.reason ? 'Reason given: “' + esc(d.reason) + '”' : (d.status === 'approved' ? 'This event would now appear publicly.' : 'No reason was given.')}<button class="undo" data-undo="${e.id}" type="button">Undo</button></div>` : `
      <div class="acts">
        <button class="approve" data-approve="${e.id}" type="button">Approve</button>
        <button class="reject" data-reject="${e.id}" type="button">Reject</button>
      </div>
      <div class="reason" id="reason-${e.id}">
        <input type="text" id="reasonIn-${e.id}" placeholder="Reason (optional) — shown to the host">
        <button class="confirm" data-confirm="${e.id}" type="button">Confirm reject</button>
      </div>`}
    </div>`;
  }).join('');

  // opening an event's details (title link, "View full details", or a click on the card) counts as viewing it
  list.querySelectorAll('.ev a').forEach(a => a.addEventListener('click', () => markViewed(a.closest('.ev').dataset.id)));
  list.querySelectorAll('.ev').forEach(card => card.addEventListener('click', (ev) => {
    if(ev.target.closest('button, input, a, .reason')) return;   // those do their own thing
    const e = EVENTS.find(x => x.id === card.dataset.id);
    if(!e) return;
    markViewed(e.id);
    window.open(eventDetailUrl(e), '_blank', 'noopener');
  }));
  list.querySelectorAll('[data-approve]').forEach(b => b.onclick = () => { decisions[b.dataset.approve] = { status:'approved' }; jset(DEC_KEY, decisions); render(); });
  list.querySelectorAll('[data-reject]').forEach(b => b.onclick = () => document.getElementById('reason-' + b.dataset.reject).classList.toggle('show'));
  list.querySelectorAll('[data-confirm]').forEach(b => b.onclick = () => {
    const id = b.dataset.confirm;
    decisions[id] = { status:'rejected', reason: document.getElementById('reasonIn-' + id).value.trim() };
    jset(DEC_KEY, decisions); render();
  });
  list.querySelectorAll('[data-undo]').forEach(b => b.onclick = () => { delete decisions[b.dataset.undo]; jset(DEC_KEY, decisions); render(); });
}

function renderUserChip(){
  const u = getCurrentAdmin();
  document.getElementById('userName').textContent = u.name;
  document.getElementById('userRole').textContent = u.roleLabel;
  const dp = document.getElementById('userDp');
  dp.innerHTML = '';
  if(u.avatar){ const img = document.createElement('img'); img.src = u.avatar; img.alt = u.name; dp.appendChild(img); }
  else dp.textContent = u.name.split(/\s+/).filter(Boolean).map(p => p[0]).slice(0, 2).join('').toUpperCase();
}

function applyIdentity(){
  loadIdentity();
  renderUserChip();
  viewedAll = jget(VIEWED_KEY, {});
  f.category = f.country = f.state = f.city = f.zip = '';
  document.getElementById('fZip').value = '';
  tab = 'pending';
  // The main admin sees everything, so there is nothing to explain; a normal admin gets their scope spelled out.
  const box = document.getElementById('scopeBox');
  box.style.display = isMain ? 'none' : '';
  box.innerHTML = isMain ? '' : scopeText();
  render();
}
['fCategory','fCountry','fState','fCity'].forEach(id => document.getElementById(id).addEventListener('change', e => {
  f[{fCategory:'category', fCountry:'country', fState:'state', fCity:'city'}[id]] = e.target.value; render();
}));
document.getElementById('fZip').addEventListener('input', e => { f.zip = e.target.value.trim(); render(); });
document.getElementById('clearBtn').onclick = () => { f.category = f.country = f.state = f.city = f.zip = ''; document.getElementById('fZip').value = ''; render(); };
document.querySelectorAll('.tab').forEach(t => t.onclick = () => { tab = t.dataset.tab; render(); });
document.getElementById('resetBtn').onclick = () => { decisions = {}; viewedAll = {}; jset(DEC_KEY, decisions); jset(VIEWED_KEY, viewedAll); render(); };
SanghaAdmin.ready.then(ok => { if(ok) applyIdentity(); });
</script>
</body>
