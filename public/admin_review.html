<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Review — Sangha (prototype)</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Lato:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#FFFFFF; --card:#FFFDF8; --forest:#000; --rust:#F2A94E; --sage:#FBE3B8; --ink:#0D0D0D; --line:#E4E4E4; }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Lato',sans-serif;-webkit-font-smoothing:antialiased;}
  button,select,input{font-family:inherit;}
  button{cursor:pointer;}
  .wrap{max-width:780px;margin:0 auto;padding:20px 20px 80px;}
  .userbar{display:flex;justify-content:flex-end;align-items:center;gap:12px;margin-bottom:18px;}
  .userbar .who{text-align:right;line-height:1.25;}
  .userbar .who-name{font-weight:700;font-size:13.5px;}
  .userbar .who-role{font-size:11.5px;opacity:.6;}
  .dp{width:42px;height:42px;border-radius:50%;background:var(--forest);color:var(--rust);display:flex;align-items:center;justify-content:center;font-family:'Poppins',sans-serif;font-weight:700;font-size:14px;overflow:hidden;flex-shrink:0;border:2px solid var(--sage);}
  .dp img{width:100%;height:100%;object-fit:cover;display:block;}
  .title{font-family:'Poppins',sans-serif;font-size:26px;font-weight:700;margin-bottom:16px;}
  .scope{background:var(--forest);color:#fff;border-radius:12px;padding:13px 16px;font-size:12.5px;line-height:1.6;margin-bottom:16px;}
  .scope b{color:var(--rust);}
  .filters{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:16px;}
  .filters-title{font-size:11px;text-transform:uppercase;letter-spacing:.06em;opacity:.55;font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}
  .filters-title button{background:none;border:none;font-size:12px;font-weight:700;text-decoration:underline;text-transform:none;letter-spacing:0;opacity:.8;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;}
  .grid label{display:block;font-size:11px;font-weight:700;opacity:.6;margin-bottom:4px;}
  .grid select,.grid input{width:100%;padding:9px 10px;border-radius:9px;border:1px solid var(--line);font-size:13px;background:#fff;outline:none;}
  .grid select:focus,.grid input:focus{border-color:var(--rust);}

  /* top-level section switcher: Events Review / Messages / Host */
  .main-tabs{display:flex;gap:8px;margin-bottom:18px;border-bottom:1px solid var(--line);}
  .main-tab{padding:11px 4px;margin-right:18px;border:none;background:none;font-family:'Poppins',sans-serif;font-size:14.5px;font-weight:700;opacity:.5;border-bottom:3px solid transparent;border-radius:0;}
  .main-tab.on{opacity:1;border-bottom-color:var(--rust);}
  .main-tab .cnt{font-family:'Lato',sans-serif;font-weight:700;opacity:.55;font-size:12px;margin-left:3px;}

  .tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
  .tab{padding:8px 15px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:700;}
  .tab.on{background:var(--ink);color:#fff;border-color:var(--ink);}
  .ev{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;cursor:pointer;transition:border-color .15s,box-shadow .15s;}
  .ev:hover{border-color:var(--rust);box-shadow:0 4px 16px rgba(0,0,0,.06);}
  .ev-title a{color:inherit;text-decoration:none;}
  .ev-title a:hover{text-decoration:underline;}
  .view-link{display:inline-block;font-size:12px;font-weight:700;color:#8a5b12;text-decoration:none;margin:0 0 12px;}
  .view-link:hover{text-decoration:underline;}
  .ev-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
  .ev-title{font-family:'Poppins',sans-serif;font-size:16px;font-weight:700;}
  .ev-meta{font-size:12px;opacity:.6;margin-top:3px;line-height:1.55;}
  .pill{flex-shrink:0;font-size:10.5px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--sage);border:1px solid var(--rust);white-space:nowrap;}
  .pill.ok{background:#eef7ee;border-color:#bfe3bf;color:#2e7d32;}
  .pill.no{background:#fdecea;border-color:#e5b4ac;color:#c0392b;}
  .pill.mid{background:#fff;border-color:var(--line);color:inherit;opacity:.7;}
  .pill.warn{background:#FFF4E5;border-color:var(--rust);color:#8a5b12;}
  .desc{font-size:13px;line-height:1.6;opacity:.85;margin:12px 0;}
  .acts{display:flex;gap:10px;}
  .approve{flex:1;padding:11px;border-radius:10px;background:#2e7d32;color:#fff;font-weight:700;font-size:13px;border:none;}
  .approve:hover{opacity:.9;}
  .reject{flex:1;padding:11px;border-radius:10px;background:transparent;border:1.5px solid #c0392b;color:#c0392b;font-weight:700;font-size:13px;}
  .reject:hover{background:#fdecea;}
  .reason{display:none;gap:8px;margin-top:10px;}
  .reason.show{display:flex;}
  .reason input{flex:1;padding:9px 11px;border-radius:8px;border:1px solid var(--line);font-size:12.5px;outline:none;}
  .confirm{padding:9px 14px;border-radius:8px;background:#c0392b;color:#fff;font-weight:700;font-size:12px;border:none;flex-shrink:0;}
  .note{font-size:12px;opacity:.6;margin-top:8px;}
  .seen-tag{display:inline-block;font-size:11px;font-weight:700;color:#8a5b12;background:var(--sage);border-radius:999px;padding:2px 9px;margin-top:6px;}
  .undo{background:none;border:none;font-size:12px;text-decoration:underline;opacity:.65;margin-left:8px;}
  .empty{font-size:14px;opacity:.55;text-align:center;padding:40px 0;}

  /* Messages tab */
  .msg{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:12px;cursor:pointer;transition:border-color .15s,box-shadow .15s;}
  .msg:hover{border-color:var(--rust);box-shadow:0 4px 16px rgba(0,0,0,.06);}
  .msg-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
  .msg-from{font-family:'Poppins',sans-serif;font-size:15px;font-weight:700;}
  .msg-meta{font-size:12px;opacity:.6;margin-top:3px;line-height:1.5;}
  .msg-subject{font-size:13.5px;font-weight:700;margin-top:10px;}
  .msg-preview{font-size:13px;line-height:1.6;opacity:.8;margin-top:4px;}
  .tag-kind{flex-shrink:0;font-size:10.5px;font-weight:700;padding:5px 10px;border-radius:999px;white-space:nowrap;}
  .tag-kind.customer{background:var(--sage);border:1px solid var(--rust);}
  .tag-kind.support{background:#e8f0fe;border:1px solid #93b4f2;color:#1a4fab;}

  /* Hosts tab */
  .host-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:12px;display:flex;gap:14px;align-items:center;}
  .host-card a.hn{color:inherit;text-decoration:none;}
  .host-card a.hn:hover{text-decoration:underline;}
  .host-ava{width:44px;height:44px;border-radius:50%;background:var(--forest);color:var(--rust);display:flex;align-items:center;justify-content:center;font-family:'Poppins',sans-serif;font-weight:700;font-size:15px;flex-shrink:0;border:2px solid var(--sage);}
  .host-name{font-family:'Poppins',sans-serif;font-size:15.5px;font-weight:700;}
  .host-meta{font-size:12px;opacity:.6;margin-top:3px;line-height:1.5;}
  .host-stats{margin-left:auto;text-align:right;flex-shrink:0;}
  .host-stats b{display:block;font-family:'Poppins',sans-serif;font-size:16px;}
  .host-stats span{font-size:11px;opacity:.6;}

  /* Message popup */
  .modal-overlay{position:fixed;inset:0;background:rgba(13,13,13,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100;}
  .modal-box{background:#fff;border-radius:16px;max-width:460px;width:100%;max-height:85vh;overflow-y:auto;padding:24px;position:relative;}
  .modal-close{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;}
  .modal-close:hover{border-color:#c0392b;color:#c0392b;}
  .modal-from{font-family:'Poppins',sans-serif;font-size:16px;font-weight:700;padding-right:30px;}
  .modal-meta{font-size:12px;opacity:.6;margin-top:3px;}
  .modal-subject{font-size:13.5px;font-weight:700;margin-top:14px;}
  .modal-body{font-size:13.5px;line-height:1.6;opacity:.85;margin-top:6px;}
  .modal-reply-lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;opacity:.55;font-weight:700;margin:18px 0 6px;}
  .modal-box textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);font-size:13.5px;font-family:inherit;outline:none;resize:vertical;}
  .modal-box textarea:focus{border-color:var(--rust);}
  .modal-actions{display:flex;gap:10px;margin-top:14px;}
  .modal-actions button{flex:1;padding:11px;border-radius:10px;font-weight:700;font-size:13px;border:none;}
  .mm-resolve{background:transparent;border:1.5px solid #2e7d32;color:#2e7d32;}
  .mm-resolve:hover{background:#eef7ee;}
  .mm-submit{background:var(--rust);color:#fff;}
  .mm-submit:hover{opacity:.9;}
  .modal-status{font-size:12px;opacity:.6;margin-top:8px;text-align:center;min-height:1.2em;}
</style>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sanga Admin">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png">
<script src="/js/sanga-pwa.js" defer></script>
<style>html.sg-locked body{visibility:hidden}</style>
<script>document.documentElement.classList.add("sg-locked")</script>
</head>
<body>
<div class="wrap">
  <!-- Who is logged in. Filled in by renderUserChip() from getCurrentAdmin(). -->
  <div class="userbar">
    <div class="who"><div class="who-name" id="userName"></div><div class="who-role" id="userRole"></div></div>
    <div class="dp" id="userDp"></div>
  </div>

  <div class="main-tabs">
    <button class="main-tab on" data-main="events" type="button">Events review <span class="cnt" id="mainCntEvents"></span></button>
    <button class="main-tab" data-main="messages" type="button">Messages <span class="cnt" id="mainCntMessages"></span></button>
    <button class="main-tab" data-main="hosts" type="button">Host <span class="cnt" id="mainCntHosts"></span></button>
  </div>

  <!-- ===================== EVENTS REVIEW ===================== -->
  <div id="panel-events">
    <div class="title">Events review</div>

    <div class="scope" id="scopeBox"></div>

    <div class="filters">
      <div class="filters-title"><span>Filter</span><button id="clearBtn" type="button">Clear filters</button></div>
      <div class="grid">
        <div><label for="fCategory">Category</label><select id="fCategory"></select></div>
        <div><label for="fCity">City</label><select id="fCity"></select></div>
      </div>
    </div>

    <div class="tabs">
      <button class="tab on" data-tab="pending" type="button">Pending <span id="cntPending"></span></button>
      <button class="tab" data-tab="approved" type="button">Approved <span id="cntApproved"></span></button>
      <button class="tab" data-tab="flagged" type="button" title="A reviewer flagged this from the event details page; needs a final decision">Flagged <span id="cntFlagged"></span></button>
      <button class="tab" data-tab="rejected" type="button">Rejected <span id="cntRejected"></span></button>
      <button class="tab" data-tab="viewed" type="button" title="Opened, but not approved or rejected yet">Viewed <span id="cntViewed"></span></button>
    </div>

    <div id="list"></div>
  </div>

  <!-- ===================== MESSAGES ===================== -->
  <div id="panel-messages" style="display:none;">
    <div class="title">Messages</div>

    <div class="scope" id="msgScopeBox"></div>

    <div class="filters">
      <div class="filters-title"><span>Filter</span><button id="msgClearBtn" type="button">Clear filters</button></div>
      <div class="grid">
        <div><label for="mfKind">Type</label><select id="mfKind"><option value="">Customer &amp; support</option><option value="customer">Customer</option><option value="support">Support</option></select></div>
        <div><label for="mfCategory">Category</label><select id="mfCategory"></select></div>
        <div><label for="mfCountry">Country</label><select id="mfCountry"></select></div>
        <div><label for="mfState">State / region</label><select id="mfState"></select></div>
        <div><label for="mfCity">City</label><select id="mfCity"></select></div>
        <div><label for="mfZip">Zip / postal code</label><input id="mfZip" type="text" placeholder="e.g. 787"></div>
      </div>
    </div>

    <div class="tabs">
      <button class="tab on" data-mtab="open" type="button">Open <span id="cntMsgOpen"></span></button>
      <button class="tab" data-mtab="resolved" type="button">Resolved <span id="cntMsgResolved"></span></button>
    </div>

    <div id="msgList"></div>
  </div>

  <!-- ===================== HOST ===================== -->
  <div id="panel-hosts" style="display:none;">
    <div class="title">Host</div>

    <div class="scope" id="hostScopeBox"></div>

    <div class="filters">
      <div class="filters-title"><span>Filter</span><button id="hostClearBtn" type="button">Clear filters</button></div>
      <div class="grid">
        <div><label for="hfCategory">Category</label><select id="hfCategory"></select></div>
        <div><label for="hfCity">City</label><select id="hfCity"></select></div>
      </div>
    </div>

    <div class="tabs">
      <button class="tab on" data-htab="active" type="button">Active <span id="cntHostActive"></span></button>
      <button class="tab" data-htab="suspended" type="button">Suspended <span id="cntHostSuspended"></span></button>
    </div>

    <div id="hostList"></div>
  </div>
</div>

<!-- Message popup: opened by clicking a message; Esc or the × button closes it. -->
<div id="msgModalOverlay" class="modal-overlay" style="display:none;">
  <div class="modal-box">
    <button class="modal-close" id="mmClose" type="button" aria-label="Close">×</button>
    <div class="modal-from" id="mmFrom"></div>
    <div class="modal-meta" id="mmMeta"></div>
    <div class="modal-subject" id="mmSubject"></div>
    <div class="modal-body" id="mmBody"></div>
    <div class="modal-reply-lbl">Reply</div>
    <textarea id="mmReply" rows="4" placeholder="Write a reply…"></textarea>
    <div class="modal-actions">
      <button class="mm-resolve" id="mmResolve" type="button">Mark resolved</button>
      <button class="mm-submit" id="mmSubmit" type="button">Submit</button>
    </div>
    <div class="modal-status" id="mmStatus"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-functions-compat.js"></script>
<script src="/js/firebase-config.js"></script>
<script src="/js/sanga-auth.js"></script>
<script src="/js/admin-session.js"></script>
<script>
const VIEWED_KEY   = 'sanga_admin_viewed_v1';   // { [adminId]: { [eventId]: time first/last opened } }
const MSG_KEY       = 'sanga_admin_messages_v1'; // { [messageId]: { status: 'open'|'resolved', reply: '…' } }

function jget(k, d){ try{ return JSON.parse(localStorage.getItem(k)) || d; }catch(e){ return d; } }
function jset(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const emptyScope = () => ({ countries:[], states:[], cities:[], zips:[], categories:[] });
const normScope = (s) => Object.assign(emptyScope(), s || {});
const initials = n => String(n || '').split(/\s+/).filter(Boolean).map(p => p[0]).slice(0, 2).join('').toUpperCase() || '?';

/* Support/customer messages — there is no real backend for these yet anywhere in the app (no
   Firestore collection, no Cloud Function): "Message host" on event_detail_view.html only ever
   simulated sending. Until that exists, this tab has nothing real to show, so it stays empty
   rather than showing fabricated conversations. */
const MESSAGES = [];

/* ---- the Host tab ----
   Hosts are derived straight from the same live Firestore "events" collection the Events review
   tab already reads (see liveEvents above) — one row per distinct hostId/hostName seen in the
   admin's scope, grouped the same way events are filtered. There is no separate host-profile
   collection yet, so fields a real profile would have (rating, join date, suspended/active) don't
   exist here: "eventsHosted" is a real count of that host's event documents, and clicking a host
   links to their real profile via SanghaAdmin.profileUrl (the same getPublicProfile-backed lookup
   the event cards already use for hostProfileUrl), not a fabricated one. */
function computeHosts(){
  const byHost = new Map();
  hostsFilteredEvents().forEach((e) => {
    const key = e.hostId || e.hostName || '';
    if(!key) return;
    if(!byHost.has(key)) byHost.set(key, { id: e.hostId || '', name: e.hostName || 'Host', cities: new Set(), eventsHosted: 0 });
    const h = byHost.get(key);
    if(e.city) h.cities.add(e.city);
    h.eventsHosted++;
  });
  return Array.from(byHost.values()).map((h) => Object.assign(h, { city: Array.from(h.cities).join(', ') }));
}

/* ---- link to the event details page ----
   Opens event_detail_view.html read-only (readonly=1 hides the message-host and share
   buttons, which a reviewer shouldn't use; review=1 hides the guest's "You're going —
   booking confirmed" banner, which doesn't apply to a reviewer, and swaps in the Approve/
   Flag/Message host reviewer actions).
   This admin site doesn't load sanga-data.js (that's sanga-rep's own data layer), so
   event_detail_view.html here can't look up the live event itself the way it does on the real
   app — every real field it needs has to be passed in the link, same as the old sample data did. */
const DETAIL_PAGE = 'event_detail_view.html';
// Where clicking the host (on the details page) goes. Real events carry a real hostId.
// A host's name opens the full profile for a MAIN admin and the privacy-filtered one for a normal admin.
function hostProfileUrl(e){ return SanghaAdmin.profileUrl({ id: e.hostId, name: e.hostName }); }
// Real events don't have a single "groupSize" string or "dateDisplay"/"timeDisplay" — derive them
// from the raw fields /events/create_event.html actually saves (same logic sanga-rep's own pages use).
function eventGroupSize(e){
  if(e.audience === 'group') return `${e.minSize || '?'}–${e.maxSize || '?'} guests`;
  if(e.maxCountMode === 'nolimit') return 'No limit on attendees';
  return e.maxCount ? `Up to ${e.maxCount} guests` : '';
}
function eventDateDisplay(e){
  return (e.sessions && e.sessions[0] && e.sessions[0].date) ? e.sessions[0].date : (e.date || 'Date TBD');
}
function eventTimeDisplay(e){
  const tb = e.timeBlocks && e.timeBlocks[0];
  if(!tb || (!tb.startTime && !tb.endTime)) return '';
  return (tb.startTime || '?') + (tb.endTime ? '–' + tb.endTime : '');
}
function eventDetailUrl(e){
  const q = new URLSearchParams({ id: e.id, readonly: '1', review: '1' });
  q.set('hostProfile', hostProfileUrl(e));
  q.set('status', 'upcoming');
  q.set('title', e.title || 'Untitled event');
  q.set('host', e.hostName || 'Host');
  q.set('category', e.category || '');
  q.set('city', e.city || '');
  q.set('desc', e.desc || '');
  q.set('dateDisplay', eventDateDisplay(e));
  q.set('timeDisplay', eventTimeDisplay(e));
  q.set('reviewStatus', e.status || '');
  q.set('duration', e.duration || '');
  q.set('price', e.isFree ? '0' : String(e.price || '0'));
  q.set('groupSize', eventGroupSize(e));
  q.set('includes', JSON.stringify(e.includes || []));
  q.set('cancellation', e.cancellation || '');
  return DETAIL_PAGE + '?' + q.toString();
}

/* ========== IDENTITY — the signed-in admin ==========
   js/admin-session.js signs the person in (same phone + PIN login as the app), checks their
   record in the Firestore "admins" collection, and fills SanghaAdmin.admin:
       { role: 'main' | 'admin', userId, name, roleLabel, avatar, scope }
   Until that is ready this returns a harmless placeholder (the page is hidden meanwhile). */
function getCurrentAdmin(){
  return (window.SanghaAdmin && SanghaAdmin.admin) || { role:'admin', userId:'', name:'', roleLabel:'', avatar:'', scope:null };
}
/* ========================================================================== */
let roles = {};   // (kept so older code paths still find it; real limits come from SanghaAdmin.admin.scope)

let me, isMain, myScope;
function loadIdentity(){
  me = getCurrentAdmin();
  isMain = me.role === 'main';
  myScope = isMain ? null : normScope(me.scope);
}
loadIdentity();
let tab = 'pending';
const f = { category:'', city:'' };

// Everything an admin's scope can narrow: countries/states/cities/zips always; categories only
// matters for events and hosts (messages don't have one).
function inScope(item, s, opts){
  if(!s) return true;
  opts = opts || {};
  const ci = (a, v) => a.some(x => x.toLowerCase() === String(v || '').toLowerCase());
  if(!opts.noCountryState && s.countries.length && !ci(s.countries, item.country)) return false;
  if(!opts.noCountryState && s.states.length && !ci(s.states, item.state)) return false;
  if(s.cities.length && !ci(s.cities, item.city)) return false;
  if(!opts.noZip && s.zips.length && !s.zips.some(z => String(item.zip || '').toLowerCase().startsWith(z.toLowerCase()))) return false;
  if(!opts.noCategory && s.categories.length && !s.categories.includes(item.category)) return false;
  return true;
}

/* ---- real events, straight from Firestore ----
   An admin's record lets them read every event, in any status (firestore.rules). Live-synced with
   onSnapshot, so Approve/Reject from another tab, another admin, or the event details page all show
   up here immediately — no more cross-tab localStorage/'storage'-event trick needed.
   Real events only carry a plain city string, not country/state/zip, so an admin's scope only
   narrows events by city and category — country/state/zip scope has no effect here (same for the
   Host tab below, which is derived from this same event list). */
let liveEvents = [];
let eventsLoaded = false;
sanghaDb.collection('events').onSnapshot((snap) => {
  liveEvents = snap.docs.map((d) => Object.assign({}, d.data(), { id: d.id }));
  eventsLoaded = true;
  if(window.SanghaAdmin && SanghaAdmin.admin){ render(); renderHosts(); }   // identity already loaded: re-render on every change
}, (err) => console.warn('Could not load events from Firestore:', err));

const baseEvents = () => liveEvents.filter(e => inScope(e, myScope, { noCountryState:true, noZip:true }));
const uniq = (arr) => Array.from(new Set(arr.filter(Boolean))).sort((a, b) => a.localeCompare(b));

function fill(id, values, current, allLabel){
  const el = document.getElementById(id);
  el.innerHTML = `<option value="">${allLabel}</option>` + values.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join('');
  el.value = values.includes(current) ? current : '';
  return el.value;
}

function renderFilters(){
  const base = baseEvents();
  f.category = fill('fCategory', uniq(base.map(e => e.category)), f.category, 'All categories');
  f.city     = fill('fCity',     uniq(base.map(e => e.city)),     f.city,     'All cities');
}

function passes(e){
  return (!f.category || e.category === f.category)
      && (!f.city     || e.city === f.city);
}

function scopeText(withCategories, opts){
  opts = opts || {};
  const parts = [];
  if(!opts.noCountryState && myScope.countries.length) parts.push(`countries: <b>${esc(myScope.countries.join(', '))}</b>`);
  if(!opts.noCountryState && myScope.states.length)    parts.push(`states: <b>${esc(myScope.states.join(', '))}</b>`);
  if(myScope.cities.length)     parts.push(`cities: <b>${esc(myScope.cities.join(', '))}</b>`);
  if(!opts.noCountryState && myScope.zips.length) parts.push(`zip codes: <b>${esc(myScope.zips.join(', '))}</b>`);
  if(withCategories !== false && myScope.categories.length) parts.push(`categories: <b>${esc(myScope.categories.join(', '))}</b>`);
  return parts.length ? 'You see ' + parts.join(' &nbsp;·&nbsp; ') : '';   // nothing narrowed yet: no box to show
}

/* ---- "Viewed" = events this admin has opened to read the details ---- */
let viewedAll = jget(VIEWED_KEY, {});
const myViewed = () => viewedAll[me.userId] || {};
const seenTag = '<span class="seen-tag">✓ Viewed</span>';

// which events fall in each tab (after scope + filters). Firestore has four real statuses for an
// event an admin can see here (see firestore.rules): pending_review (just published, not public
// yet), flagged (a reviewer — here or from the event details page — marked it for a final
// approve/reject call, not public), published (approved, publicly visible) and rejected.
function groups(){
  const visible = baseEvents().filter(passes);
  const seen = myViewed();
  return {
    pending:  visible.filter(e => e.status === 'pending_review'),
    approved: visible.filter(e => e.status === 'published'),
    flagged:  visible.filter(e => e.status === 'flagged'),
    rejected: visible.filter(e => e.status === 'rejected'),
    // Viewed = opened but still undecided (pending or flagged) — once approved/rejected it moves on.
    viewed:   visible.filter(e => seen[e.id] && (e.status === 'pending_review' || e.status === 'flagged')).sort((a, b) => seen[b.id] - seen[a.id]),   // most recently opened first
  };
}
function refreshCounts(){
  const g = groups();
  ['Pending','Approved','Flagged','Rejected','Viewed'].forEach(n => { document.getElementById('cnt' + n).textContent = `(${g[n.toLowerCase()].length})`; });
  document.getElementById('mainCntEvents').textContent = `(${g.pending.length})`;
}
// Called when an event's details are opened. Updates in place (no re-draw), so the
// link/click that triggered it is never interrupted.
function markViewed(id){
  viewedAll = jget(VIEWED_KEY, {});
  (viewedAll[me.userId] = viewedAll[me.userId] || {})[id] = Date.now();
  jset(VIEWED_KEY, viewedAll);
  const slot = document.querySelector(`.ev[data-id="${id}"] .seen-slot`);
  if(slot) slot.innerHTML = seenTag;
  refreshCounts();
}

const EMPTY = {
  pending:  ['Nothing waiting for review right now. 🎉', 'No pending events match these filters.'],
  approved: ['No approved events yet.', 'No approved events match these filters.'],
  flagged:  ['Nothing flagged for rejection right now.', 'No flagged events match these filters.'],
  rejected: ['No rejected events yet.', 'No rejected events match these filters.'],
  viewed:   ["Nothing here. Events you open but haven't decided on yet show up in this tab.", 'No viewed events match these filters.'],
};

// Writes straight to Firestore (firestore.rules lets any admin change ONLY an event's status, to
// 'published', 'rejected', 'flagged' or back to 'pending_review' — nothing else about the event).
// The onSnapshot listener above re-renders every open tab, on every device, the moment this
// commits — no extra bookkeeping here. The card is also updated OPTIMISTICALLY, before Firestore
// confirms anything: on a slow connection the real confirmation can take a while, and a reviewer
// who sees no visible change tends to just press the button again. If the write fails, this undoes
// the local change and falls back to the alert.
async function decide(id, status, reason){
  const card = document.querySelector(`.ev[data-id="${id}"]`);
  if(card) card.querySelectorAll('button').forEach(b => b.disabled = true);
  const ev = liveEvents.find(x => x.id === id);
  const prevStatus = ev ? ev.status : null;
  const prevNote = ev ? ev.reviewNote : null;
  if(ev){
    ev.status = status;
    if(status === 'rejected') ev.reviewNote = reason || '';
    render();
  }
  try{
    const patch = { status, reviewedBy: me.userId, reviewedAt: firebase.firestore.FieldValue.serverTimestamp() };
    if(status === 'rejected') patch.reviewNote = reason || '';
    await sanghaDb.collection('events').doc(id).update(patch);
  }catch(e){
    if(ev){ ev.status = prevStatus; ev.reviewNote = prevNote; render(); }
    alert("Couldn't save that decision: " + (e.message || e));
  }
}

function render(){
  renderFilters();
  refreshCounts();
  document.querySelectorAll('#panel-events .tab').forEach(t => t.classList.toggle('on', t.dataset.tab === tab));

  const list = document.getElementById('list');
  if(!eventsLoaded){ list.innerHTML = `<div class="empty">Loading events…</div>`; return; }
  const shown = groups()[tab];
  if(!shown.length){
    const filtering = f.category || f.city;
    list.innerHTML = `<div class="empty">${EMPTY[tab][filtering ? 1 : 0]}</div>`;
    return;
  }
  const seen = myViewed();
  list.innerHTML = shown.map(e => {
    const pillClass = e.status === 'published' ? 'ok' : e.status === 'flagged' ? 'warn' : e.status === 'rejected' ? 'no' : 'mid';
    const pillText = e.status === 'published' ? 'Approved' : e.status === 'flagged' ? 'Flagged' : e.status === 'rejected' ? 'Rejected' : 'Pending';
    return `
    <div class="ev" data-id="${esc(e.id)}">
      <div class="ev-head">
        <div>
          <div class="ev-title"><a href="${esc(eventDetailUrl(e))}" target="_blank" rel="noopener">${esc(e.title || 'Untitled event')}</a></div>
          <div class="ev-meta">${esc(e.city || '')}<br>${esc(e.category || '')} · hosted by ${esc(e.hostName || 'Host')}</div>
          <div class="seen-slot">${seen[e.id] ? seenTag : ''}</div>
        </div>
        <span class="pill ${pillClass}">${pillText}</span>
      </div>
      <div class="desc">${esc(e.desc || '')}</div>
      <a class="view-link" href="${esc(eventDetailUrl(e))}" target="_blank" rel="noopener">View full details →</a>
      ${e.status === 'rejected' ? `<div class="note">${e.reviewNote ? 'Reason given: “' + esc(e.reviewNote) + '”' : 'No reason was given.'}</div>` : ''}
      ${e.status === 'published' ? `<div class="note">This event is live on Sangha home.</div>` : ''}
      ${e.status === 'flagged' ? `<div class="note">🚩 Flagged for rejection — needs a final decision.<button class="undo" data-clearflag="${esc(e.id)}" type="button">Clear flag</button></div>` : ''}
      <div class="acts">
        <button class="approve" data-approve="${esc(e.id)}" type="button"${e.status === 'published' ? ' disabled' : ''}>${e.status === 'published' ? 'Approved' : 'Approve'}</button>
        <button class="reject" data-reject="${esc(e.id)}" type="button">Reject</button>
      </div>
      <div class="reason" id="reason-${esc(e.id)}">
        <input type="text" id="reasonIn-${esc(e.id)}" placeholder="Reason (optional) — shown to the host">
        <button class="confirm" data-confirm="${esc(e.id)}" type="button">Confirm reject</button>
      </div>
    </div>`;
  }).join('');

  // opening an event's details (title link, "View full details", or a click on the card) counts as viewing it
  list.querySelectorAll('.ev a').forEach(a => a.addEventListener('click', () => markViewed(a.closest('.ev').dataset.id)));
  list.querySelectorAll('.ev').forEach(card => card.addEventListener('click', (ev) => {
    if(ev.target.closest('button, input, a, .reason')) return;   // those do their own thing
    const e = liveEvents.find(x => x.id === card.dataset.id);
    if(!e) return;
    markViewed(e.id);
    window.open(eventDetailUrl(e), '_blank', 'noopener');
  }));
  list.querySelectorAll('[data-approve]').forEach(b => b.onclick = () => decide(b.dataset.approve, 'published'));
  list.querySelectorAll('[data-reject]').forEach(b => b.onclick = () => document.getElementById('reason-' + b.dataset.reject).classList.toggle('show'));
  list.querySelectorAll('[data-confirm]').forEach(b => b.onclick = () => {
    const id = b.dataset.confirm;
    decide(id, 'rejected', document.getElementById('reasonIn-' + id).value.trim());
  });
  list.querySelectorAll('[data-clearflag]').forEach(b => b.onclick = () => decide(b.dataset.clearflag, 'pending_review'));
}

/* ===================== MESSAGES ===================== */
const mf = { kind:'', category:'', country:'', state:'', city:'', zip:'' };
let mtab = 'open';
let msgStore = jget(MSG_KEY, {});   // local reply/resolved overrides, same pattern as before
const msgStatus = (m) => (msgStore[m.id] && msgStore[m.id].status) || m.status;
const msgReply  = (m) => (msgStore[m.id] && msgStore[m.id].reply) || '';
const baseMessages = () => MESSAGES.filter(m => inScope(m, myScope, { noZip:true, noCategory:true }));
function passesMsg(m){
  return (!mf.kind     || m.kind === mf.kind)
      && (!mf.category || m.category === mf.category)
      && (!mf.country  || m.country === mf.country)
      && (!mf.state    || m.state === mf.state)
      && (!mf.city     || m.city === mf.city)
      && (!mf.zip      || String(m.zip || '').toLowerCase().startsWith(mf.zip.toLowerCase()));
}
function renderMsgFilters(){
  const base = baseMessages();
  document.getElementById('mfKind').value = mf.kind;
  mf.category = fill('mfCategory', uniq(base.map(m => m.category)), mf.category, 'All categories');
  mf.country = fill('mfCountry', uniq(base.map(m => m.country)), mf.country, 'All countries');
  const inCountry = base.filter(m => !mf.country || m.country === mf.country);
  mf.state = fill('mfState', uniq(inCountry.map(m => m.state)), mf.state, 'All states');
  const inState = inCountry.filter(m => !mf.state || m.state === mf.state);
  mf.city = fill('mfCity', uniq(inState.map(m => m.city)), mf.city, 'All cities');
}
function msgGroups(){
  const visible = baseMessages().filter(passesMsg);
  return { open: visible.filter(m => msgStatus(m) === 'open'), resolved: visible.filter(m => msgStatus(m) === 'resolved') };
}
const MSG_EMPTY = {
  open:     ['Nothing open right now. 🎉', 'No open messages match these filters.'],
  resolved: ['No resolved messages yet.', 'No resolved messages match these filters.'],
};
function renderMessages(){
  renderMsgFilters();
  const g = msgGroups();
  document.getElementById('cntMsgOpen').textContent = `(${g.open.length})`;
  document.getElementById('cntMsgResolved').textContent = `(${g.resolved.length})`;
  document.getElementById('mainCntMessages').textContent = `(${g.open.length})`;
  document.querySelectorAll('#panel-messages .tab').forEach(t => t.classList.toggle('on', t.dataset.mtab === mtab));

  const list = document.getElementById('msgList');
  const shown = g[mtab];
  if(!shown.length){
    const filtering = mf.kind || mf.category || mf.country || mf.state || mf.city || mf.zip;
    list.innerHTML = `<div class="empty">${MSG_EMPTY[mtab][filtering ? 1 : 0]}</div>`;
    return;
  }
  list.innerHTML = shown.map(m => {
    const place = [m.city, m.state, m.country].filter(Boolean).join(', ');
    return `
    <div class="msg" data-id="${m.id}">
      <div class="msg-head">
        <div>
          <div class="msg-from">${esc(m.from)}</div>
          <div class="msg-meta">${esc(place)} · ${esc(m.dateDisplay)}</div>
        </div>
        <span class="tag-kind ${m.kind}">${m.kind === 'support' ? 'Support' : 'Customer'}</span>
      </div>
      <div class="msg-subject">${esc(m.subject)}</div>
      <div class="msg-preview">${esc(m.preview)}</div>
      ${msgReply(m) ? '<span class="seen-tag">✓ Replied</span>' : ''}
    </div>`;
  }).join('');
  list.querySelectorAll('.msg').forEach(card => card.addEventListener('click', () => openMsgModal(card.dataset.id)));
}

/* ---- message popup: full message, a reply box, Submit and Mark resolved ---- */
let mmId = null;
function openMsgModal(id){
  const m = MESSAGES.find(x => x.id === id);
  if(!m) return;
  mmId = id;
  const place = [m.city, m.state, m.country].filter(Boolean).join(', ');
  document.getElementById('mmFrom').textContent = m.from;
  document.getElementById('mmMeta').textContent = place + ' · ' + m.dateDisplay;
  document.getElementById('mmSubject').textContent = m.subject;
  document.getElementById('mmBody').textContent = m.preview;
  document.getElementById('mmReply').value = msgReply(m);
  document.getElementById('mmStatus').textContent = '';
  document.getElementById('mmResolve').textContent = msgStatus(m) === 'resolved' ? 'Already resolved' : 'Mark resolved';
  document.getElementById('mmResolve').disabled = msgStatus(m) === 'resolved';
  document.getElementById('msgModalOverlay').style.display = 'flex';
  document.getElementById('mmReply').focus();
}
function closeMsgModal(){
  document.getElementById('msgModalOverlay').style.display = 'none';
  mmId = null;
}
function saveMsgState(patch){
  msgStore = jget(MSG_KEY, {});
  msgStore[mmId] = Object.assign({ status: 'open' }, msgStore[mmId], patch);
  jset(MSG_KEY, msgStore);
}
document.getElementById('mmClose').onclick = closeMsgModal;
document.getElementById('msgModalOverlay').addEventListener('click', (e) => { if(e.target.id === 'msgModalOverlay') closeMsgModal(); });
document.addEventListener('keydown', (e) => { if(e.key === 'Escape' && document.getElementById('msgModalOverlay').style.display !== 'none') closeMsgModal(); });
document.getElementById('mmSubmit').onclick = () => {
  const reply = document.getElementById('mmReply').value.trim();
  saveMsgState({ reply });
  document.getElementById('mmStatus').textContent = reply ? 'Reply sent ✓' : 'Saved ✓';
  renderMessages();
  setTimeout(closeMsgModal, 500);
};
document.getElementById('mmResolve').onclick = () => {
  saveMsgState({ status: 'resolved' });
  renderMessages();
  closeMsgModal();
};

/* ===================== HOSTS ===================== */
// category/city only — real events (and so real hosts) don't carry country/state/zip, same as
// the Events review filters above.
const hf = { category:'', city:'' };
let htab = 'active';
const hostsFilteredEvents = () => baseEvents().filter(e => (!hf.category || e.category === hf.category) && (!hf.city || e.city === hf.city));
function renderHostFilters(){
  const base = baseEvents();
  hf.category = fill('hfCategory', uniq(base.map(e => e.category)), hf.category, 'All categories');
  hf.city     = fill('hfCity',     uniq(base.map(e => e.city)),     hf.city,     'All cities');
}
function hostGroups(){
  // Every real host counts as "active" — there is no suspend/reinstate feature yet, so
  // "Suspended" stays empty rather than showing fabricated entries.
  return { active: computeHosts(), suspended: [] };
}
const HOST_EMPTY = {
  active:    ['No hosts yet — hosts appear here once someone has submitted an event.', 'No hosts match these filters.'],
  suspended: ['No suspended hosts.', 'No suspended hosts match these filters.'],
};
function renderHosts(){
  renderHostFilters();
  const g = hostGroups();
  document.getElementById('cntHostActive').textContent = `(${g.active.length})`;
  document.getElementById('cntHostSuspended').textContent = `(${g.suspended.length})`;
  document.getElementById('mainCntHosts').textContent = `(${g.active.length + g.suspended.length})`;
  document.querySelectorAll('#panel-hosts .tab').forEach(t => t.classList.toggle('on', t.dataset.htab === htab));

  const list = document.getElementById('hostList');
  if(!eventsLoaded){ list.innerHTML = `<div class="empty">Loading hosts…</div>`; return; }
  const shown = g[htab];
  if(!shown.length){ list.innerHTML = `<div class="empty">${HOST_EMPTY[htab][1]}</div>`; return; }
  list.innerHTML = shown.map(h => {
    const url = esc(SanghaAdmin.profileUrl({ id: h.id, name: h.name }));
    return `
    <div class="host-card">
      <div class="host-ava">${initials(h.name)}</div>
      <div>
        <div class="host-name"><a class="hn" href="${url}" target="_blank" rel="noopener">${esc(h.name)}</a></div>
        <div class="host-meta">${esc(h.city)}</div>
      </div>
      <div class="host-stats"><b>${esc(h.eventsHosted)}</b><span>events</span></div>
    </div>`;
  }).join('');
}

function renderUserChip(){
  const u = getCurrentAdmin();
  document.getElementById('userName').textContent = u.name;
  document.getElementById('userRole').textContent = u.roleLabel;
  const dp = document.getElementById('userDp');
  dp.innerHTML = '';
  if(u.avatar){ const img = document.createElement('img'); img.src = u.avatar; img.alt = u.name; dp.appendChild(img); }
  else dp.textContent = u.name.split(/\s+/).filter(Boolean).map(p => p[0]).slice(0, 2).join('').toUpperCase();
}

let mainTab = 'events';
function renderMainTabs(){
  document.querySelectorAll('.main-tab').forEach(t => t.classList.toggle('on', t.dataset.main === mainTab));
  document.getElementById('panel-events').style.display   = mainTab === 'events'   ? '' : 'none';
  document.getElementById('panel-messages').style.display = mainTab === 'messages' ? '' : 'none';
  document.getElementById('panel-hosts').style.display    = mainTab === 'hosts'    ? '' : 'none';
}
document.querySelectorAll('.main-tab').forEach(t => t.onclick = () => { mainTab = t.dataset.main; renderMainTabs(); });

// Shows the scope box only when the admin's scope actually narrows something; hidden for a main
// admin (who sees everything) and for a normal admin with no limits set yet (same thing from
// their point of view — nothing to explain).
function setScopeBox(elId, withCategories, opts){
  const el = document.getElementById(elId);
  const txt = isMain ? '' : scopeText(withCategories, opts);
  el.style.display = txt ? '' : 'none';
  el.innerHTML = txt;
}

function applyIdentity(){
  loadIdentity();
  renderUserChip();
  viewedAll = jget(VIEWED_KEY, {});
  msgStore = jget(MSG_KEY, {});
  f.category = f.city = '';
  mf.kind = mf.category = mf.country = mf.state = mf.city = mf.zip = '';
  document.getElementById('mfZip').value = '';
  hf.category = hf.city = '';
  tab = 'pending'; mtab = 'open'; htab = 'active';
  setScopeBox('scopeBox', true, { noCountryState: true });   // real events only carry city, not country/state/zip
  setScopeBox('msgScopeBox', false);
  setScopeBox('hostScopeBox', true, { noCountryState: true });   // hosts are derived from the same real events
  renderMainTabs();
  render();
  renderMessages();
  renderHosts();
}
['fCategory','fCity'].forEach(id => document.getElementById(id).addEventListener('change', e => {
  f[{fCategory:'category', fCity:'city'}[id]] = e.target.value; render();
}));
document.getElementById('clearBtn').onclick = () => { f.category = f.city = ''; render(); };
document.querySelectorAll('#panel-events .tab').forEach(t => t.onclick = () => { tab = t.dataset.tab; render(); });

['mfKind','mfCategory','mfCountry','mfState','mfCity'].forEach(id => document.getElementById(id).addEventListener('change', e => {
  mf[{mfKind:'kind', mfCategory:'category', mfCountry:'country', mfState:'state', mfCity:'city'}[id]] = e.target.value; renderMessages();
}));
document.getElementById('mfZip').addEventListener('input', e => { mf.zip = e.target.value.trim(); renderMessages(); });
document.getElementById('msgClearBtn').onclick = () => { mf.kind = mf.category = mf.country = mf.state = mf.city = mf.zip = ''; document.getElementById('mfZip').value = ''; renderMessages(); };
document.querySelectorAll('#panel-messages .tab').forEach(t => t.onclick = () => { mtab = t.dataset.mtab; renderMessages(); });

['hfCategory','hfCity'].forEach(id => document.getElementById(id).addEventListener('change', e => {
  hf[{hfCategory:'category', hfCity:'city'}[id]] = e.target.value; renderHosts();
}));
document.getElementById('hostClearBtn').onclick = () => { hf.category = hf.city = ''; renderHosts(); };
document.querySelectorAll('#panel-hosts .tab').forEach(t => t.onclick = () => { htab = t.dataset.htab; renderHosts(); });

SanghaAdmin.ready.then(ok => { if(ok) applyIdentity(); });
</script>
