<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cover library — Sangha admin</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Lato:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#FFFFFF; --card:#FFFDF8; --forest:#000; --rust:#F2A94E; --sage:#FBE3B8; --ink:#0D0D0D; --line:#E4E4E4; }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Lato',sans-serif;-webkit-font-smoothing:antialiased;}
  button,input{font-family:inherit;}
  button{cursor:pointer;}
  a{color:inherit;text-decoration:none;}
  .wrap{max-width:980px;margin:0 auto;padding:20px 20px 80px;}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px;}
  .title{font-family:'Poppins',sans-serif;font-size:26px;font-weight:700;}
  .sub{font-size:13.5px;opacity:.65;margin:4px 0 18px;line-height:1.5;}
  .nav-link{font-size:13px;font-weight:700;padding:9px 14px;border-radius:10px;border:1px solid var(--forest);display:inline-block;}
  .nav-link:hover{background:var(--forest);color:#fff;}
  .cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:22px;}
  .cat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;}
  .cat b{display:block;font-family:'Poppins',sans-serif;font-size:13.5px;}
  .cat span{font-size:12px;opacity:.6;}
  .cat.on{background:var(--forest);color:#fff;border-color:var(--forest);}
  .cat.on span{opacity:.8;}
  .section{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:20px;}
  .sec-title{font-family:'Poppins',sans-serif;font-size:16px;font-weight:700;margin-bottom:2px;}
  .sec-sub{font-size:12.5px;opacity:.6;margin-bottom:14px;line-height:1.5;}
  .drop{display:block;width:100%;border:2px dashed #b9ae95;border-radius:14px;background:var(--sage);padding:22px;text-align:center;font-size:14px;font-weight:700;}
  .drop small{display:block;font-weight:400;opacity:.65;margin-top:4px;font-size:12px;}
  .drop.over{border-color:var(--forest);background:#f7d79a;}
  .drop.off{opacity:.5;cursor:not-allowed;}
  .btn{padding:9px 16px;border-radius:8px;font-weight:700;font-size:12.5px;border:none;background:var(--rust);color:#fff;}
  .btn:hover{opacity:.9;}
  .btn.dark{background:var(--ink);}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);}
  .btn.ghost:hover{border-color:#c0392b;color:#c0392b;}
  .btn[disabled]{opacity:.5;cursor:not-allowed;}
  .bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:14px 0;}
  .status{font-size:12.5px;opacity:.75;}
  .progress{height:6px;border-radius:99px;background:var(--line);overflow:hidden;flex:1;min-width:140px;display:none;}
  .progress i{display:block;height:100%;width:0;background:var(--rust);transition:width .2s;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;}
  .ph{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  .ph img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#eee;}
  .ph .meta{padding:8px;display:flex;flex-direction:column;gap:6px;}
  .ph .num{font-size:11px;opacity:.55;font-weight:700;}
  .ph input{width:100%;padding:6px 8px;border-radius:8px;border:1px solid var(--line);font-size:12px;}
  .ph .del{font-size:11.5px;padding:5px 8px;}
  .empty{font-size:13px;opacity:.5;text-align:center;padding:22px 0;}
  .err{color:#c0392b;font-size:12.5px;margin-top:6px;}
</style>
<style>html.sg-locked body{visibility:hidden}</style>
<script>document.documentElement.classList.add("sg-locked")</script>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="title">Cover library</div>
    <a class="nav-link" href="admin_settings.html">← Admin Settings</a>
  </div>
  <div class="sub">Photos that hosts get when they tap "Suggest one" on Create event. Each category holds up to 100 photos and they are handed out one after the other (1, 2, 3 … then back to 1). Pictures are shrunk to 1280px before they are saved.</div>

  <div class="cats" id="cats"></div>

  <div class="section" id="panel" style="display:none;">
    <div class="sec-title" id="panelTitle"></div>
    <div class="sec-sub" id="panelSub"></div>
    <label class="drop" id="drop" for="fileInput">
      Click to choose pictures, or drag them here
      <small id="dropHint">JPG, PNG or WebP</small>
    </label>
    <input type="file" id="fileInput" accept="image/*" multiple style="display:none;">
    <div class="bar">
      <div class="progress" id="progress"><i id="progressBar"></i></div>
      <span class="status" id="status"></span>
      <button class="btn dark" id="zipBtn" type="button" style="margin-left:auto;display:none;">Download all as zip</button>
    </div>
    <div class="err" id="err"></div>
    <div class="grid" id="photos"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-functions-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="/js/firebase-config.js"></script>
<script src="/js/sanga-auth.js"></script>
<script src="/js/admin-session.js"></script>
<script>
const CATEGORIES = ["Hiking","Walk & connect","Yoga","Sustainability","Refresh & Reset","Music","Sports","Gardening","Rooted in nature"];
const MAX_PHOTOS = 100;
const MAX_WIDTH = 1280;
const slug = (c) => c.toLowerCase().replace(/&/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

let db, storage, isMain = false, me = '';
let current = null;          // selected category name
const lists = {};            // category -> [{ id, order, path, url, credit }] sorted by order
let busy = false;

const $ = (id) => document.getElementById(id);
function colRef(cat){ return db.collection('coverLibrary').doc(slug(cat)).collection('photos'); }

async function loadCategory(cat){
  const snap = await colRef(cat).orderBy('order').get();
  lists[cat] = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
}

function renderCats(){
  $('cats').innerHTML = CATEGORIES.map(c =>
    `<button type="button" class="cat${c === current ? ' on' : ''}" data-cat="${esc(c)}"><b>${esc(c)}</b><span>${lists[c] ? lists[c].length : '…'} / ${MAX_PHOTOS} photos</span></button>`).join('');
}

function renderPanel(){
  if(!current){ $('panel').style.display = 'none'; return; }
  const list = lists[current] || [];
  const room = MAX_PHOTOS - list.length;
  $('panel').style.display = '';
  $('panelTitle').textContent = current;
  $('panelSub').textContent = list.length + ' of ' + MAX_PHOTOS + ' photos. ' + (room > 0 ? 'You can add ' + room + ' more.' : 'This category is full. Remove a photo to add another.');
  $('drop').classList.toggle('off', room <= 0 || busy);
  $('fileInput').disabled = room <= 0 || busy;
  $('zipBtn').style.display = isMain && list.length ? '' : 'none';
  $('photos').innerHTML = list.length ? list.map((p, i) => `
    <div class="ph">
      <img src="${esc(p.url)}" alt="" loading="lazy">
      <div class="meta">
        <div class="num">#${i + 1}</div>
        <input type="text" data-credit="${esc(p.id)}" value="${esc(p.credit || '')}" placeholder="Credit (optional)" maxlength="120">
        ${isMain ? `<button type="button" class="btn ghost del" data-del="${esc(p.id)}">Remove</button>` : ''}
      </div>
    </div>`).join('') : '<div class="empty">No photos yet. Add some above.</div>';
}

async function select(cat){
  current = cat;
  $('err').textContent = ''; $('status').textContent = '';
  renderCats(); renderPanel();
  if(!lists[cat]) { await loadCategory(cat); renderCats(); renderPanel(); }
}

function toJpeg(file){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, MAX_WIDTH / img.naturalWidth);
      const w = Math.round(img.naturalWidth * scale), h = Math.round(img.naturalHeight * scale);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? resolve(b) : reject(new Error('compress')), 'image/jpeg', 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('not an image')); };
    img.src = url;
  });
}

async function upload(files){
  if(busy || !current) return;
  const cat = current;
  const list = lists[cat] || (lists[cat] = []);
  const images = Array.from(files).filter(f => f.type.indexOf('image/') === 0);
  const room = MAX_PHOTOS - list.length;
  const take = images.slice(0, Math.max(0, room));
  $('err').textContent = '';
  if(!take.length){ $('err').textContent = room <= 0 ? 'This category is full.' : 'Please choose picture files.'; return; }
  busy = true; renderPanel();
  $('progress').style.display = 'block';
  let done = 0, failed = 0;
  let order = list.reduce((m, p) => Math.max(m, p.order || 0), 0);
  for(const file of take){
    $('status').textContent = 'Uploading ' + (done + failed + 1) + ' of ' + take.length + '…';
    try {
      const blob = await toJpeg(file);
      const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
      const path = 'coverLibrary/' + slug(cat) + '/' + id + '.jpg';
      const ref = storage.ref(path);
      await ref.put(blob, { contentType: 'image/jpeg' });
      const url = await ref.getDownloadURL();
      order += 1;
      const doc = { order, path, url, credit: '', uploadedBy: me, createdAt: firebase.firestore.FieldValue.serverTimestamp() };
      await colRef(cat).doc(id).set(doc);
      await db.collection('coverLibrary').doc(slug(cat)).set({ name: cat }, { merge: true });
      list.push({ id, order, path, url, credit: '' });
      done += 1;
    } catch(e){
      console.warn('Upload failed', file.name, e);
      failed += 1;
    }
    $('progressBar').style.width = Math.round((done + failed) / take.length * 100) + '%';
    renderCats(); renderPanel();
  }
  busy = false;
  $('progress').style.display = 'none'; $('progressBar').style.width = '0';
  const skipped = images.length - take.length;
  $('status').textContent = done + ' added' + (failed ? ', ' + failed + ' failed' : '') + (skipped > 0 ? ', ' + skipped + ' left out (limit of ' + MAX_PHOTOS + ')' : '') + '.';
  if(failed) $('err').textContent = 'Some pictures could not be saved. Check you are signed in as an admin and that Storage is turned on, then try again.';
  renderCats(); renderPanel();
}

async function removePhoto(id){
  const list = lists[current] || [];
  const p = list.find(x => x.id === id);
  if(!p || !isMain) return;
  if(!confirm('Remove this photo from ' + current + '?')) return;
  try {
    await colRef(current).doc(id).delete();
    try { await storage.ref(p.path).delete(); } catch(e){ console.warn('Storage delete', e); }
    lists[current] = list.filter(x => x.id !== id);
    $('status').textContent = 'Photo removed.';
  } catch(e){
    $('err').textContent = 'Could not remove the photo: ' + (e && e.message || e);
  }
  renderCats(); renderPanel();
}

async function downloadZip(){
  const list = lists[current] || [];
  if(!isMain || !list.length) return;
  const cat = current;
  $('err').textContent = ''; $('zipBtn').disabled = true;
  try {
    const zip = new JSZip();
    for(let i = 0; i < list.length; i++){
      $('status').textContent = 'Preparing zip: ' + (i + 1) + ' of ' + list.length + '…';
      const res = await fetch(list[i].url);
      if(!res.ok) throw new Error('A photo could not be fetched (' + res.status + ').');
      zip.file(slug(cat) + '-' + String(i + 1).padStart(3, '0') + '.jpg', await res.blob());
    }
    const out = await zip.generateAsync({ type: 'blob' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(out); a.download = slug(cat) + '-photos.zip';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    $('status').textContent = 'Zip downloaded.';
  } catch(e){
    $('status').textContent = '';
    $('err').textContent = 'Could not make the zip. If this says "Failed to fetch", the storage bucket still needs the CORS setting (see storage-cors.json in the main repo). ' + (e && e.message || '');
  }
  $('zipBtn').disabled = false;
}

$('cats').addEventListener('click', (ev) => { const b = ev.target.closest('.cat'); if(b) select(b.dataset.cat); });
$('fileInput').addEventListener('change', (ev) => { upload(ev.target.files); ev.target.value = ''; });
$('zipBtn').addEventListener('click', downloadZip);
$('photos').addEventListener('click', (ev) => { const b = ev.target.closest('[data-del]'); if(b) removePhoto(b.dataset.del); });
$('photos').addEventListener('change', async (ev) => {
  const inp = ev.target.closest('[data-credit]'); if(!inp) return;
  const p = (lists[current] || []).find(x => x.id === inp.dataset.credit); if(!p) return;
  try { await colRef(current).doc(p.id).update({ credit: inp.value.trim().slice(0, 120) }); p.credit = inp.value.trim(); $('status').textContent = 'Credit saved.'; }
  catch(e){ $('err').textContent = 'Could not save the credit.'; }
});
['dragenter','dragover'].forEach(t => $('drop').addEventListener(t, (ev) => { ev.preventDefault(); $('drop').classList.add('over'); }));
['dragleave','drop'].forEach(t => $('drop').addEventListener(t, (ev) => { ev.preventDefault(); $('drop').classList.remove('over'); }));
$('drop').addEventListener('drop', (ev) => { if(ev.dataTransfer && ev.dataTransfer.files) upload(ev.dataTransfer.files); });

SanghaAdmin.ready.then(async (ok) => {
  if(!ok) return;
  db = firebase.firestore(); storage = firebase.storage();
  isMain = !!(SanghaAdmin.admin && SanghaAdmin.admin.role === 'main');
  me = (SanghaAdmin.admin && SanghaAdmin.admin.userId) || '';
  renderCats();
  await Promise.all(CATEGORIES.map(c => loadCategory(c).catch(e => { console.warn('Load failed', c, e); lists[c] = []; })));
  renderCats();
});
</script>
</body>
</html>
