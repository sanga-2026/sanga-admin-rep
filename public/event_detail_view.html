<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Lato:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0D0D0D;
    --cream:#FFFFFF;
    --card:#FFFDF8;
    --forest:#000000;
    --rust:#F2A94E;
    --sage:#FBE3B8;
    --line:#E4E4E4;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:'Lato',sans-serif;-webkit-font-smoothing:antialiased;}
  .display{font-family:'Poppins',sans-serif;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  textarea, input{font-family:inherit;}
  img{display:block;max-width:100%;}

  .wrap{max-width:907px;margin:0 auto;padding:0 20px 60px;}

  /* ---------- topbar ---------- */
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:20px 0;}
  .topbar-left{display:flex;align-items:center;gap:8px;}
  .topbar-left [data-sg-nav]{margin-left:0 !important;}
  .easy-book{height:37px;padding:0 15px;border-radius:12px;background:var(--forest);color:var(--rust);font-weight:700;font-size:12.5px;align-items:center;white-space:nowrap;}
  .easy-book:hover{opacity:.88;}
  .back-icon{width:36px;height:36px;border-radius:50%;border:1px solid var(--forest);background:var(--forest);color:var(--rust);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
  .back-icon:hover{border-color:var(--rust);}
  .badge-wrap{display:flex;align-items:center;gap:8px;}
  .badge{width:26px;height:26px;border-radius:50%;background:var(--forest);display:flex;align-items:center;justify-content:center;}
  .badge svg{stroke:var(--rust);}
  .badge-label{font-family:'Poppins',sans-serif;font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.65;}

  /* ---------- status banner ---------- */
  .status-banner{display:flex;align-items:center;gap:10px;border-radius:12px;padding:12px 14px;font-size:13px;font-weight:700;margin-bottom:16px;}
  .status-banner.upcoming{background:var(--sage);border:1px solid var(--rust);color:var(--ink);}
  .status-banner.past{background:var(--card);border:1px solid var(--line);color:var(--ink);opacity:.8;}
  .status-banner svg{flex-shrink:0;}
  .status-banner.upcoming svg{stroke:var(--rust);}
  .status-banner.past svg{stroke:var(--ink);opacity:.6;}

  /* ---------- hero ---------- */
  .photo{position:relative;width:100%;aspect-ratio:16/10;border-radius:16px;overflow:hidden;background:#eee;margin-bottom:18px;}
  .save-heart{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;border:none;background:rgba(13,13,13,.55);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2;}
  .save-heart:hover{background:rgba(13,13,13,.75);}
  .save-heart svg{fill:none;stroke:#fff;}
  .save-heart.saved svg{fill:#fff;}
  .photo img{width:100%;height:100%;object-fit:cover;}

  .cat-chip{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:5px 11px;border-radius:999px;background:var(--forest);color:var(--rust);border:1px solid var(--rust);margin-bottom:10px;}

  h1.title{font-family:'Poppins',sans-serif;font-size:25px;font-weight:700;margin:0 0 14px;line-height:1.25;}

  /* ---------- host row ---------- */
  .host-row{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:18px;}
  .host-avatar{width:42px;height:42px;border-radius:50%;background:var(--forest);color:var(--rust);display:flex;align-items:center;justify-content:center;font-family:'Poppins',sans-serif;font-weight:700;font-size:15px;flex-shrink:0;}
  .host-info{flex:1;min-width:0;}
  .host-info .label{font-size:11px;opacity:.55;text-transform:uppercase;letter-spacing:.06em;}
  .host-info .name{font-size:14.5px;font-weight:700;}
  .host-info .reply-note{font-size:11.5px;opacity:.6;margin-top:1px;}

  /* ---------- meta ---------- */
  .meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;}
  @media (max-width:420px){ .meta-grid{grid-template-columns:1fr;} }
  .meta-item{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;}
  .meta-item svg{stroke:var(--rust);flex-shrink:0;margin-top:1px;}
  .meta-item .meta-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;opacity:.55;margin-bottom:2px;}
  .meta-item .meta-val{font-size:13px;font-weight:700;line-height:1.35;}

  /* ---------- sections ---------- */
  .section-title{font-family:'Poppins',sans-serif;font-size:15.5px;font-weight:700;color:#000;margin:0 0 10px;}
  .section{margin-bottom:22px;}
  .map-view{height:200px;border-radius:12px;margin-top:10px;overflow:hidden;border:1px solid rgba(0,0,0,.12);z-index:0;}
  .map-links{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:13px;}
  .map-links a{color:inherit;text-decoration:underline;}
  .desc-text{white-space:pre-line;font-size:14px;line-height:1.7;opacity:.85;}

  .includes-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
  @media (max-width:420px){ .includes-grid{grid-template-columns:1fr;} }
  .includes-grid div{display:flex;align-items:flex-start;gap:8px;font-size:13px;line-height:1.4;}
  .includes-grid svg{stroke:var(--rust);flex-shrink:0;margin-top:2px;}

  .logistics-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;}
  .logistics-row{display:flex;align-items:flex-start;gap:10px;font-size:13.5px;line-height:1.5;}
  .logistics-row + .logistics-row{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);}
  .logistics-row svg{stroke:var(--rust);flex-shrink:0;margin-top:2px;}
  .logistics-row .llabel{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;opacity:.55;margin-bottom:2px;}
  .logistics-row a.link-val{color:var(--rust);font-weight:700;word-break:break-all;}

  .cancel-text{font-size:13px;line-height:1.6;opacity:.75;}

  /* ---------- actions ---------- */
  .actions{display:flex;gap:10px;margin:26px 0 10px;flex-wrap:wrap;}
  .action-btn{flex:1;min-width:160px;display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border-radius:12px;font-size:13.5px;font-weight:700;position:relative;}
  .action-btn svg{flex-shrink:0;}
  .action-btn.primary{background:var(--rust);color:#fff;}
  .action-btn.primary:hover{opacity:.92;}
  .action-btn.secondary{background:var(--forest);color:#fff;}
  .action-btn.secondary:hover{opacity:.9;}
  .action-btn.secondary svg{stroke:var(--rust);}
  .action-btn.flag{background:#fff;border:1.5px solid #F2A94E;color:#8a5b12;}
  .action-btn.flag:hover{background:#FFF4E5;}
  .action-btn.flag.is-active{background:#F2A94E;color:#fff;}
  .action-btn.primary.is-active{background:#2e7d32;}

  .cal-menu{position:absolute;bottom:calc(100% + 8px);left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.12);overflow:hidden;z-index:20;text-align:left;}
  .cal-menu.hidden{display:none;}
  .cal-menu button, .cal-menu a{display:block;width:100%;padding:12px 16px;font-size:13px;font-weight:700;color:var(--ink);text-align:left;}
  .cal-menu button:hover, .cal-menu a:hover{background:var(--card);}
  .cal-menu button + button, .cal-menu a + a, .cal-menu button + a{border-top:1px solid var(--line);}

  /* ---------- message compose panel ---------- */
  .compose-panel{margin-top:6px;border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:var(--card);display:none;}
  .compose-panel.open{display:block;}
  .compose-panel .compose-title{font-family:'Poppins',sans-serif;font-size:14px;font-weight:700;margin-bottom:4px;}
  .compose-panel .compose-sub{font-size:12.5px;opacity:.65;margin-bottom:12px;}
  .compose-textarea{width:100%;min-height:96px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:13.5px;line-height:1.6;resize:vertical;outline:none;background:#fff;}
  .compose-textarea:focus{border-color:var(--rust);}
  .compose-send-row{display:flex;gap:8px;margin-top:10px;}
  .btn-send{padding:10px 18px;border-radius:9px;background:var(--rust);color:#fff;font-size:12.5px;font-weight:700;}
  .btn-cancel-msg{padding:10px 18px;border-radius:9px;background:transparent;border:1px solid var(--line);font-size:12.5px;font-weight:700;}
  .compose-sent{text-align:center;padding:16px 10px;}
  .compose-sent .check{width:38px;height:38px;border-radius:50%;background:var(--sage);border:1px solid var(--rust);display:flex;align-items:center;justify-content:center;margin:0 auto 10px;}
  .compose-sent .check svg{stroke:var(--rust);}

  .cal-toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(10px);background:var(--forest);color:#fff;font-size:12.5px;font-weight:700;padding:11px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;}
  .cal-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ---------- share row ---------- */
  .share-section{margin-bottom:22px;}
  .share-row{display:flex;justify-content:space-between;gap:8px;}
  .share-btn{display:flex;flex-direction:column;align-items:center;gap:7px;flex:1;padding:4px 0;}
  .share-btn:hover .share-icon{transform:translateY(-1px);}
  .share-icon{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:transform .15s;border:1px solid var(--line);background:var(--card);}
  .share-icon.email{color:var(--ink);}
  .share-icon.whatsapp{color:#25D366;border-color:#25D36655;}
  .share-icon.sms{color:#3B82F6;border-color:#3B82F655;}
  .share-icon.copylink{color:var(--ink);border-color:var(--line);}
  .share-label{font-size:11px;font-weight:700;opacity:.75;}
  @media (max-width:380px){
    .share-icon{width:42px;height:42px;}
    .share-icon svg{width:16px;height:16px;}
    .share-label{font-size:9.5px;}
  }

  /* ---------- supporting files ---------- */
  .sf-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media (max-width:420px){ .sf-grid{grid-template-columns:1fr;} }
  .sf-card{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:9px 10px;background:var(--card);}
  .sf-card:hover{border-color:var(--rust);}
  .sf-card img{width:42px;height:42px;border-radius:8px;object-fit:cover;flex-shrink:0;}
  .sf-generic-icon{width:42px;height:42px;border-radius:8px;background:var(--sage);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .sf-generic-icon svg{stroke:var(--rust);}
  .sf-name{font-size:12.5px;font-weight:700;line-height:1.3;}
  .sf-view{font-size:11px;opacity:.55;margin-top:1px;}
  /* supporting pictures: a left-to-right album of 2-inch pictures; other files stay as cards */
  .sf-group-title{font-family:'Poppins',sans-serif;font-size:15.5px;font-weight:700;color:#000;margin:16px 0 10px;}   /* each title the host typed: same look as the other section titles */
  .sf-group-title:first-child{margin-top:0;}
  .sf-album{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;}
  .sf-photo{flex:0 0 192px;width:192px;height:192px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--card);scroll-snap-align:start;display:block;}
  .sf-photo img{width:100%;height:100%;object-fit:cover;display:block;}
  .sf-files{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px;}
  @media (max-width:420px){ .sf-files{grid-template-columns:1fr;} }
  /* picture viewer: click a supporting picture to see it large; arrows / swipe / keys move between pictures */
  .sf-lb{position:fixed;inset:0;z-index:3000;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;flex-direction:column;padding:16px;}
  .sf-lb[hidden]{display:none;}
  .sf-lb img{max-width:min(94vw,1100px);max-height:78vh;object-fit:contain;border-radius:10px;background:#111;}
  .sf-lb-cap{color:#fff;font-size:13px;margin-top:12px;text-align:center;opacity:.9;}
  .sf-lb-btn{position:absolute;background:rgba(255,255,255,.14);color:#fff;border:none;border-radius:50%;width:44px;height:44px;font-size:26px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .sf-lb-btn:hover{background:rgba(255,255,255,.28);}
  .sf-lb-x{top:14px;right:14px;} .sf-lb-prev{left:14px;top:50%;margin-top:-22px;} .sf-lb-next{right:14px;top:50%;margin-top:-22px;}
  .sf-lb-btn[hidden]{display:none;}

</style>

  const v = params.get(key);

// If this id belongs to an event actually published in /events/create_event.html,
// pull its real details in instead of the hardcoded demo defaults.
// A real event opened by its id alone (from the home page or a short link) carries no date text in the address, so the
// date and time are worked out from the event itself: "Mon, Nov 2, 2026" and "5:00 PM – 7:00 PM".
function niceDay(iso){
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || '');
  if(!m) return '';
  return new Date(+m[1], +m[2] - 1, +m[3]).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
}
function niceClock(t){
  const m = /^(\d{1,2}):(\d{2})/.exec(t || '');
  if(!m) return '';
  const h = +m[1];
  return ((h % 12) || 12) + ':' + m[2] + ' ' + (h >= 12 ? 'PM' : 'AM');
}
function whenOfEvent(ev){
  let day = '', times = [], iso = '', isoEnd = '';
  if(ev.scheduleMode === 'multi' && Array.isArray(ev.sessions) && ev.sessions.length){
    const first = ev.sessions[0];
    day = niceDay(first.startDate);
    if(first.endDate && first.endDate !== first.startDate) day += ' – ' + niceDay(first.endDate);
    if(ev.sessions.length > 1) day += '  +' + (ev.sessions.length - 1) + ' more date' + (ev.sessions.length > 2 ? 's' : '');
    if(first.startTime) times.push(niceClock(first.startTime) + (first.endTime ? ' – ' + niceClock(first.endTime) : ''));
    if(first.startDate && first.startTime){ iso = first.startDate + 'T' + first.startTime; isoEnd = first.endTime ? (first.endDate || first.startDate) + 'T' + first.endTime : ''; }
  } else {
    day = niceDay(ev.date);
    (ev.timeBlocks || []).forEach(tb => { if(tb && tb.startTime) times.push(niceClock(tb.startTime) + (tb.endTime ? ' – ' + niceClock(tb.endTime) : '')); });
    const tb0 = (ev.timeBlocks || [])[0];
    if(ev.date && tb0 && tb0.startTime){ iso = ev.date + 'T' + tb0.startTime; isoEnd = tb0.endTime ? ev.date + 'T' + tb0.endTime : ''; }
  }
  return { day, time: times.join(', '), iso, isoEnd };
}

/* ---------- add to calendar ---------- */
function toIcsDate(iso){
  // iso like 2027-05-09T18:00:00 -> 20270509T180000
  const d = new Date(iso);
  if(isNaN(d.getTime())) return null;
  const pad = n => String(n).padStart(2,'0');
  return d.getUTCFullYear() + pad(d.getUTCMonth()+1) + pad(d.getUTCDate()) + 'T' + pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + pad(d.getUTCSeconds()) + 'Z';
}
function toGoogleDate(iso){
  const d = new Date(iso);
  if(isNaN(d.getTime())) return null;
  const pad = n => String(n).padStart(2,'0');
  return d.getUTCFullYear() + pad(d.getUTCMonth()+1) + pad(d.getUTCDate()) + 'T' + pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + pad(d.getUTCSeconds()) + 'Z';
}

// The message people send: Sangha at the top (no emoji), the event name, when and where, the description and a short link.
// WhatsApp can show bold (the *stars*); email and text messages cannot, so they get plain words.
// Tidy what the host typed: spaces, capital letters, lone "i". Words are never changed.
function tidyText(t){
  t = String(t || '').replace(/[ \t]+/g, ' ').replace(/\s+([,.!?;:])/g, '$1').trim();
  t = t.replace(/\bi\b/g, 'I');
  return t.replace(/(^|[.!?]\s+|\n\s*)([a-z])/g, (m, a, c) => a + c.toUpperCase());
}
function tidyPlace(t){
  return tidyText(t).replace(/(^|[\s,(\-])([a-z])/g, (m, a, c) => a + c.toUpperCase());
}
// About 7 lines of a chat bubble. The link has the full description; email keeps all of it.
const SHARE_DESC_MAX = 190;
function shortDesc(t){
  if(t.length <= SHARE_DESC_MAX) return t;
  const cut = t.slice(0, SHARE_DESC_MAX);
  return cut.slice(0, Math.max(cut.lastIndexOf(' '), 100)).replace(/[\s,.;:!\-\u2014]+$/, '') + '...';
}
function buildShareText(bold, short){
  const b = (t) => (bold ? '*' + t + '*' : t);
  const lines = [];
  lines.push(b('Sangha'));
  lines.push(b(tidyText(data.title).replace(/(@\s*)([a-z])/g, (m, a, c) => a + c.toUpperCase())));
  lines.push('');
  const hasDate = data.dateDisplay && data.dateDisplay !== '\u2014';
  const hasTime = data.timeDisplay && data.timeDisplay !== '\u2014';
  // a line is only added when it has a value
  if(hasDate || hasTime) lines.push(b('When:') + ' ' + [hasDate ? data.dateDisplay : '', hasTime ? data.timeDisplay : ''].filter(Boolean).join(' \u00b7 '));
  const where = data.locationType === 'online' ? 'Online \u2014 details shared after registration' : tidyPlace(data.address || data.city || '').trim();
  if(where) lines.push(b('Where:') + ' ' + where);
  if(data.desc && String(data.desc).trim()){
    lines.push('');
    lines.push(short ? shortDesc(tidyText(data.desc)) : tidyText(data.desc));
  }
  if(data.includes && data.includes.length){
    lines.push('');
    lines.push("What's included:");
    data.includes.filter(i => String(i || '').trim()).forEach(i => lines.push('- ' + tidyText(i)));
  }
  const link = eventShareLink();
  if(link){
    lines.push('');
    lines.push(b('View and book:') + ' ' + link);
  }
  return lines.join('\n');
}

document.getElementById('shareEmail').addEventListener('click', () => {
  const subject = 'Activity details: ' + data.title;
  window.location.href = `mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(buildShareText(false))}`;
});

document.getElementById('shareWhatsapp').addEventListener('click', () => {
  window.open(`https://wa.me/?text=${encodeURIComponent(buildShareText(true, true))}`, '_blank', 'noopener');
});

document.getElementById('shareSms').addEventListener('click', () => {
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  const body = encodeURIComponent(buildShareText(false, true));
  window.location.href = isIOS ? `sms:&body=${body}` : `sms:?body=${body}`;
});

function buildReadonlyUrl(){
  const url = new URL(window.location.href);
  url.searchParams.set('readonly','1');
  return url.toString();
}

document.getElementById('shareCopyLink').addEventListener('click', async () => {
  if(isPreview && !eventShareLink()){ showCalToast('The link appears once the event is published'); return; }
  const link = eventShareLink() || buildReadonlyUrl();
  try{
    await navigator.clipboard.writeText(link);
    showCalToast('Link copied ✓');
  } catch(err){
    const ta = document.createElement('textarea');
    ta.value = link;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand('copy'); showCalToast('Link copied ✓'); }
    catch(err2){ showCalToast('Could not copy — copy the address bar instead'); }
    document.body.removeChild(ta);
  }
});

/* ---------- back icon: return to the home page where it was left (same scroll position) ---------- */
document.getElementById('backBtn').addEventListener('click', () => {
  try{ sessionStorage.setItem('sangha_home_restore', '1'); }catch(e){}
  if(document.referrer && /\/sanga_home\.html/.test(document.referrer) && history.length > 1) history.back();
  else window.location.href = '/sanga_home.html';
});

/* ---------- message host ----------
   Opens the chat with the host (made on the first tap) on the Messages page, where text, emojis, pictures,
   documents and a location can be sent. */
document.getElementById('msgHostBtn2').addEventListener('click', async () => {
  const btn = document.getElementById('msgHostBtn2');
  if(btn.disabled) return;
  btn.disabled = true;
  try{
    let me = null;
    if(window.SanghaAuth){ await SanghaAuth.whenReady(); me = SanghaAuth.getSession(); }
    if(!me){ window.location.href = '/login.html?next=' + encodeURIComponent(window.location.pathname + window.location.search) + '&reason=message'; return; }
    const ev = liveEvent || (window.SanghaData && data.id ? SanghaData.getEvent(data.id) : null);
    if(!ev || !ev.hostId){ showCalToast('Messages work for live events only'); btn.disabled = false; return; }
    const chatId = await SanghaChat.ensureChat({ id: ev.id, title: ev.title, hostId: ev.hostId, hostName: ev.hostName || data.host }, me);
    window.location.href = '/messages/messages.html?chat=' + encodeURIComponent(chatId);
  }catch(e){
    console.warn('Could not open the chat', e);
    showCalToast('Could not open the chat. Please try again.');
    btn.disabled = false;
  }
});

/* ---------- book ----------
   This page is for someone looking at an event that ISN'T theirs — including a visitor who
   isn't logged in. (Your own event opens on /events/self_event_detail_view.html.)
     - hasn't booked       -> a Book button that starts the real booking
     - has already booked  -> the "You're going" banner, no Book button
   Book is never shown for past events, shared read-only links or reviewers.
   Booking itself: single events -> /booking/sanga_booking.html; group events -> the group-booking
   options on the home page (/sanga_home.html?book=<id>). */
const bookBtn = document.getElementById('bookBtn');
function freezeButton(b){
  if(!b) return;
  b.disabled = true;
  b.style.opacity = '.5';
  b.style.cursor = 'not-allowed';
  b.title = 'Not available in preview';
}
const bookNote = document.getElementById('bookNote');

(async function decideBook(){
  if(!bookBtn) return;
  // Preview from Create / Edit event: the host sees the whole page as guests will, but Book and Message host are switched off.
  if(isPreview){
    bookBtn.style.display = '';
    freezeButton(bookBtn);
    freezeButton(document.getElementById('msgHostBtn2'));
    return;
  }
  const appMode = !!window.SanghaData;            // false on a bare copy of this page (e.g. your own computer)
  let session = null;
  try{ if(window.SanghaAuth){ await SanghaAuth.whenReady(); session = SanghaAuth.getSession(); } }
  catch(e){ /* not logged in / auth unavailable: treat as a visitor */ }

  // Opened your own event from a pasted link? Send you to the owner page.
  if(session && liveEvent && liveEvent.hostId && liveEvent.hostId === session.id && params.get('asguest') !== '1'){
    window.location.replace('/events/self_event_detail_view.html?id=' + encodeURIComponent(liveEvent.id));
    return;
  }

  // Already booked on this account? Then show the confirmed banner instead of Book.
  try{
    if(!isRegistered && session && appMode && data.id){
      if(SanghaData.getRegistrationsByUser(session.id).some(r => String(r.eventId) === String(data.id))){
        isRegistered = true;
        renderStatusBanner();
      }
    }
  }catch(e){ /* no bookings found */ }

  if(isPast || isRegistered || isReadonly || isReviewer){ bookBtn.remove(); return; }

  if(!appMode){
    // A bare copy with no data layer (nothing real to book): keep the original placeholder —
    // tapping Book just marks the guest as registered on this page.
    bookBtn.style.display = '';
    bookBtn.addEventListener('click', () => {
      isRegistered = true;
      renderStatusBanner();
      bookBtn.remove();
      showCalToast('Booking confirmed \u2713');
      window.scrollTo({top:0, behavior:'smooth'});
    });
    return;
  }

  if(!liveEvent){ bookBtn.remove(); return; }     // an event this browser doesn't have: nothing to book

  // Every spot taken? Then there is nothing to book.
  const left = SanghaData.spotsLeft(liveEvent);
  if(left <= 0){
    bookBtn.remove();
    bookNote.textContent = 'This activity is full.';
    bookNote.style.display = 'block';
    return;
  }

  const isGroup = liveEvent.audience === 'group';
  const isRequest = liveEvent.bookingType === 'request';
  let href, label, note;
  if(isGroup){
    href = '/sanga_home.html?book=' + encodeURIComponent(liveEvent.id);
    label = 'Book for your group';
    note = 'Choose to pay for everyone, or split the cost with your group.';
  } else {
    // Never offer more guests than there are spots left.
    const max = Math.min(Math.max(1, parseInt(liveEvent.maxCount, 10) || 8), Number.isFinite(left) ? left : Infinity);
    href = '/booking/sanga_booking.html?id=' + encodeURIComponent(liveEvent.id) + '&minGuests=1&maxGuests=' + max;
    label = isRequest ? 'Request to book' : 'Book now';
    const easy = document.getElementById('easyBookBtn');     // a second Book now at the top right of the page
    if(easy){
      easy.style.display = 'inline-flex';
      easy.addEventListener('click', () => { window.location.href = href; });
    }
    note = isRequest
      ? "You won't be charged yet — the host confirms availability first."
      : "Instant booking — you'll fill in your details and pay right away, and your spot is confirmed immediately.";
  }
  document.getElementById('bookLabel').textContent = label;
  bookBtn.style.display = '';
  bookBtn.addEventListener('click', () => { window.location.href = href; });
  bookNote.textContent = note;
  bookNote.style.display = 'block';
})();

/* ---------- read-only mode (opened from a shared "Copy link") ---------- */
// A reviewer (see below) gets their own actions instead, so this block leaves Message host
// and the actions row alone for them.
if(isReadonly && !isReviewer){
  document.getElementById('msgHostBtn2')?.remove();
  document.getElementById('composePanel')?.remove();
  document.getElementById('shareSection')?.remove();
  const actionsRow = document.getElementById('actionsRow');
  if(actionsRow){
    const calWrap = actionsRow.querySelector('div');
    if(calWrap) calWrap.style.flex = '1 1 100%';
  }
}

/* ---------- reviewer mode (opened from the admin review queue) ----------
   The "You're going — booking confirmed" banner is for a guest who has booked; a reviewer
   hasn't booked anything, so it's removed. "Add to calendar" is removed too — a reviewer
   isn't attending — and replaced with Approve / Flag for rejection, alongside the existing
   Message host button. A decision made here writes directly to the event's Firestore document
   (status: 'published' or 'flagged'), the same field the review queue itself reads and writes —
   so it shows up there immediately, on any admin's screen, without any local storage involved.
   'Flag for rejection' is not a final decision: it just marks the event pending_review -> flagged
   so another admin can make the final approve/reject call from the review queue's Flagged tab.
   Without ?review=1 none of this runs — nothing changes for a guest or a shared link. */
if(isReviewer){
  document.getElementById('statusBanner')?.remove();

  const actionsRow = document.getElementById('actionsRow');
  if(actionsRow){
    actionsRow.querySelector('#addCalBtn')?.closest('div')?.remove();   // no "Add to calendar" for a reviewer

    const approveBtn = document.createElement('button');
    approveBtn.type = 'button'; approveBtn.id = 'reviewApproveBtn'; approveBtn.className = 'action-btn primary';
    approveBtn.innerHTML = checkIcon() + ' Approve';

    const flagBtn = document.createElement('button');
    flagBtn.type = 'button'; flagBtn.id = 'reviewFlagBtn'; flagBtn.className = 'action-btn flag';
    flagBtn.innerHTML = flagIcon() + ' Flag for rejection';

    const msgBtn = document.getElementById('msgHostBtn2');
    actionsRow.insertBefore(approveBtn, actionsRow.firstChild);
    actionsRow.insertBefore(flagBtn, msgBtn || null);

    const noteEl = document.createElement('div');
    noteEl.id = 'reviewDecisionNote';
    noteEl.style.cssText = 'font-size:12px;opacity:.7;margin:-2px 0 10px;';
    actionsRow.insertAdjacentElement('afterend', noteEl);

    let currentStatus = params.get('reviewStatus') || '';

    function paintDecision(){
      const approved = currentStatus === 'published';
      approveBtn.classList.toggle('is-active', approved);
      approveBtn.innerHTML = checkIcon() + (approved ? ' Approved' : ' Approve');
      approveBtn.disabled = approved;
      flagBtn.classList.toggle('is-active', currentStatus === 'flagged');
      noteEl.textContent = approved ? '✓ You approved this event.' : '';
    }

    async function decide(status){
      if(!data.id){ return; }
      approveBtn.disabled = true; flagBtn.disabled = true;
      try{
        const patch = { status: status, reviewedBy: sanghaAuthSDK.currentUser ? sanghaAuthSDK.currentUser.uid : null,
                         reviewedAt: firebase.firestore.FieldValue.serverTimestamp() };
        await sanghaDb.collection('events').doc(data.id).update(patch);
        currentStatus = status;
      }catch(e){
        alert("Couldn't save that decision: " + (e.message || e));
      }finally{
        flagBtn.disabled = false;
        paintDecision();
      }
    }
    approveBtn.addEventListener('click', () => decide('published'));
    flagBtn.addEventListener('click', () => decide('flagged'));
    paintDecision();
  }
}

/* ---------- host profile link ---------- */
// The host's avatar and name link to their profile (/profile/user_profile_view.html?id=<host>).
// A link that includes ?hostProfile=<address> can still point somewhere else instead.
(function(){
  const override = params.get('hostProfile');
  const realHost = (liveEvent && liveEvent.hostId)
    ? '/profile/user_profile_view.html?id=' + encodeURIComponent(liveEvent.hostId) + '&name=' + encodeURIComponent(liveEvent.hostName || '')
    : '/profile/user_profile_view.html';
  const url = (override && !/^\s*(javascript|data|vbscript):/i.test(override))
    ? override
    : realHost;
  const avatar = document.getElementById('hostAvatar');
  const nameEl = document.getElementById('hostName');
  if(!avatar || !nameEl) return;
  function link(){ const a = document.createElement('a'); a.setAttribute('href', url); a.target = '_blank'; a.rel = 'noopener'; a.title = 'View host profile'; return a; }
  const aAvatar = link(); aAvatar.style.cssText = 'display:flex;flex-shrink:0;';
  avatar.parentNode.insertBefore(aAvatar, avatar); aAvatar.appendChild(avatar);
  const aName = link(); aName.style.cssText = 'color:inherit;text-decoration:underline;'; aName.textContent = nameEl.textContent;
  nameEl.textContent = ''; nameEl.appendChild(aName);
})();
</script>
<script src="/js/sanga-nav.js"></script>
<script>
/* Supporting pictures open in a viewer on this page (left / right arrows, swipe, Esc to close) instead of a new tab. */
(function(){
  let box = null, imgEl, capEl, prevB, nextB, list = [], idx = 0, startX = null;
  function build(){
    box = document.createElement('div'); box.className = 'sf-lb'; box.hidden = true;
    box.setAttribute('role', 'dialog'); box.setAttribute('aria-modal', 'true'); box.setAttribute('aria-label', 'Picture viewer');
    box.innerHTML = '<button type="button" class="sf-lb-btn sf-lb-x" aria-label="Close">&times;</button>'
      + '<button type="button" class="sf-lb-btn sf-lb-prev" aria-label="Previous picture">&#8249;</button>'
      + '<img alt=""><div class="sf-lb-cap"></div>'
      + '<button type="button" class="sf-lb-btn sf-lb-next" aria-label="Next picture">&#8250;</button>';
    document.body.appendChild(box);
    imgEl = box.querySelector('img'); capEl = box.querySelector('.sf-lb-cap');
    prevB = box.querySelector('.sf-lb-prev'); nextB = box.querySelector('.sf-lb-next');
    box.querySelector('.sf-lb-x').addEventListener('click', close);
    prevB.addEventListener('click', (e) => { e.stopPropagation(); show(idx - 1); });
    nextB.addEventListener('click', (e) => { e.stopPropagation(); show(idx + 1); });
    box.addEventListener('click', (e) => { if(e.target === box) close(); });
    box.addEventListener('touchstart', (e) => { startX = e.changedTouches[0].clientX; }, { passive: true });
    box.addEventListener('touchend', (e) => {
      if(startX === null) return;
      const dx = e.changedTouches[0].clientX - startX; startX = null;
      if(Math.abs(dx) > 40) show(idx + (dx < 0 ? 1 : -1));
    }, { passive: true });
  }
  function show(i){
    idx = (i + list.length) % list.length;
    imgEl.src = list[idx].url; imgEl.alt = list[idx].name;
    capEl.textContent = (list[idx].name ? list[idx].name + '  \u00b7  ' : '') + (idx + 1) + ' / ' + list.length;
    prevB.hidden = nextB.hidden = list.length < 2;
  }
  function open(i){ if(!box) build(); box.hidden = false; document.body.style.overflow = 'hidden'; show(i); }
  function close(){ if(!box) return; box.hidden = true; imgEl.removeAttribute('src'); document.body.style.overflow = ''; }
  document.addEventListener('click', (e) => {
    const a = e.target.closest && e.target.closest('.sf-photo');
    if(!a || e.ctrlKey || e.metaKey || e.shiftKey || e.button === 1) return;   // Ctrl/Cmd-click still opens a new tab
    e.preventDefault();
    const all = Array.from(document.querySelectorAll('.sf-photo'));
    list = all.map((x) => ({ url: x.getAttribute('href'), name: x.getAttribute('title') || '' }));
    open(all.indexOf(a));
  });
  document.addEventListener('keydown', (e) => {
    if(!box || box.hidden) return;
    if(e.key === 'Escape') close();
    else if(e.key === 'ArrowLeft') show(idx - 1);
    else if(e.key === 'ArrowRight') show(idx + 1);
  });
})();
</script>
